ody>\n  <div class=\"topline\"><div class=\"container topline-inner\"><span>Готовые линии ВПИ для Казахстана</span><span>Проектирование, производство, автоматизация и запуск</span></div></div>\n  <header class=\"header\"><div class=\"container header-inner\"><a class=\"brand\" href=\"ТТС_прототип_лендинга_Казахстан.html\"><span class=\"brand-mark\">ТТС</span><span><strong>ТТС Инжиниринг</strong><small>Казахстан</small></span></a><span class=\"partner-mark\">× QUNFENG</span><nav class=\"nav\"><a href=\"#solution\">Состав линии</a><a href=\"#roles\">Ответственность</a><a href=\"#models\">Линейка</a><a href=\"#economy\">Экономика</a></nav><a class=\"button primary\" href=\"#contact\">Получить расчёт</a></div></header>\n  <main>\n    <div class=\"container breadcrumb\"><a href=\"ТТС_прототип_лендинга_Казахстан.html\">Главная</a> &nbsp;/&nbsp; Каталог &nbsp;/&nbsp; Линии ВПИ QUNFENG + ТТС</div>\n\n    <section class=\"hero\"><div class=\"container hero-grid\"><div><p class=\"eyebrow\">QUNFENG + ТТС · единая технологическая линия</p><h1>Готовая линия ВПИ под ключ</h1><p class=\"hero-lead\">Вибропрессование от рецептуры до готовой продукции. ТТС проектирует и автоматизирует бетонную часть линии, QUNFENG комплектует участок формования, пресс-формы и околопрессовое оборудование.</p><div class=\"hero-buttons\"><a class=\"button primary\" href=\"#models\">Выбрать уровень линии →</a><a class=\"button outline\" href=\"#contact\">Запросить расчёт проекта</a></div></div><div class=\"hero-media\"><div class=\"hero-placeholder\" aria-label=\"Место для фотографии готовой линии ВПИ QUNFENG и ТТС\"><div class=\"hero-placeholder-inner\"><strong>QUNFENG × ТТС</strong><span>место для фотографии линии ВПИ</span></div></div><div class=\"hero-note\">Один комплекс · одна автоматизация · одна ответственность</div></div></div></section>\n\n    <div class=\"container metrics\"><div><strong>3</strong><span>основных уровня производительности</span></div><div><strong>15–40</strong><span>м³ бетона в час</span></div><div><strong>30–66</strong><span>изделий за цикл</span></div><div><strong>24/7</strong><span>техническая поддержка линии</span></div></div>\n\n    <section class=\"section problem-section\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Реальность рынка ВПИ</p><h2>Почему разрозненная линия не выходит на мощность</h2><p>Когда БСУ, вибропресс, конвейеры и камеры набора прочности поставляют разные компании, никто не отвечает за производственный результат целиком.</p></div><div class=\"problem-grid\"><article class=\"problem\"><span>01</span><h3>Оборудование от разных поставщиков</h3><p>Узлы не согласованы по производительности, интерфейсам и алгоритмам управления.</p><strong>Результат: споры о зоне ответственности.</strong></article><article class=\"problem\"><span>02</span><h3>Рецептура без лабораторного подбора</h3><p>Смесь настраивается методом проб и ошибок без технологических карт под местное сырьё.</p><strong>Результат: перерасход цемента и нестабильная прочность.</strong></article><article class=\"problem\"><span>03</span><h3>Отсутствие общей поддержки</h3><p>Оператор остаётся один на один с ошибками при запуске и изменении характеристик сырья.</p><strong>Результат: длительный выход на режим.</strong></article><article class=\"problem\"><span>04</span><h3>Несовместимый темп работы</h3><p>БСУ и вибропресс не синхронизированы по циклу: один узел ждёт другой или останавливает линию.</p><strong>Результат: простои и невыполнение плана.</strong></article></div></div></section>\n\n    <section class=\"section integrated\" id=\"solution\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow light\">Комплексное решение</p><h2>Вся линия от одного подрядчика</h2><p>Оборудование проектируется, комплектуется и запускается как единый производственный комплекс под продукт, сырьё и площадку заказчика.</p></div><div class=\"flow\"><article class=\"flow-step\"><span>01</span><h3>Склад и дозирование сырья</h3><p>Инертные, цемент, вода, добавки и пигменты.</p></article><article class=\"flow-step\"><span>02</span><h3>БСУ SmartBeton</h3><p>Два смесителя CO-NELE, SmartDose и АСУ SmartMix.</p></article><article class=\"flow-step\"><span>03</span><h3>Вибропресс QUNFENG</h3><p>Формование плитки, брусчатки, бордюров и блоков.</p></article><article class=\"flow-step\"><span>04</span><h3>Камеры набора прочности</h3><p>Управляемая выдержка и ускоренный оборот форм.</p></article><article class=\"flow-step\"><span>05</span><h3>Разгрузка и паллетирование</h3><p>Вывод готовых изделий и подготовка к отгрузке.</p></article></div><div class=\"responsibility\"><b>✓</b><div><strong>Единая комплектация и ответственность</strong><span>ТТС координирует проект, интеграцию, запуск и сопровождение всей линии в Казахстане.</span></div></div></div></section>\n\n    <section class=\"section roles\" id=\"roles\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">QUNFENG + ТТС</p><h2>Два производителя — один согласованный результат</h2><p>Компетенции разделены по технологическим участкам, но проектирование и запуск выполняются в едином контуре.</p></div><div class=\"role-grid\"><article class=\"role-card\"><div class=\"role-card-top\"><strong>ТТС</strong><span>Бетонная часть и интеграция</span></div><h3>Стабильная смесь и управление производством</h3><p>Собственное производство оборудования, точное дозирование, рецептуры и отчёты по каждому замесу.</p><ul class=\"role-list\"><li>БСУ SmartBeton и смесители CO-NELE</li><li>Дозирование цемента, воды, добавок и пигментов</li><li>Собственная АСУ ТП SmartMix и SmartDose</li><li>Проектирование, монтаж, пусконаладка и поддержка 24/7</li></ul></article><article class=\"role-card\"><div class=\"role-card-top\"><strong>QUNFENG</strong><span>Формование и готовое изделие</span></div><h3>Вибропрессование, формы и околопрессовое оборудование</h3><p>Оборудование для стабильной геометрии изделий и работы с широкой номенклатурой продукции.</p><ul class=\"role-list\"><li>Вибропрессы QS 1000–2000</li><li>Пресс-формы под выбранную номенклатуру</li><li>Камеры набора прочности и системы циркуляции</li><li>Разгрузка, транспортирование и паллетирование</li></ul></article></div></div></section>\n\n    <section class=\"section models\" id=\"models\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Линейка</p><h2>Три уровня производительности</h2><p>Конфигурация подбирается под продукт, сменную программу и площадь. Ниже — три основные готовые связки из буклета.</p></div><div class=\"model-grid\"><article class=\"model-card\"><div class=\"model-media\"><span>Компактная линия</span><strong>30 S</strong></div><div class=\"model-body\"><h3>SmartBeton 30 S</h3><p class=\"press\">Вибропресс QUNFENG QS 1000–1200</p><div class=\"model-specs\"><div><strong>до 15 м³/ч</strong><span>бетон</span></div><div><strong>до 30 шт./цикл</strong><span>изделия</span></div><div><strong>2 × CO-NELE</strong><span>смесители</span></div><div><strong>SmartMix</strong><span>автоматизация</span></div></div><a class=\"button outline model-request\" href=\"#contact\" data-model=\"SmartBeton 30 S + QUNFENG QS 1000–1200\">Запросить конфигурацию →</a></div></article><article class=\"model-card\"><div class=\"model-media\"><span>Средняя линия</span><strong>60 S</strong></div><div class=\"model-body\"><h3>SmartBeton 60 S</h3><p class=\"press\">Вибропресс QUNFENG QS 1500</p><div class=\"model-specs\"><div><strong>до 30 м³/ч</strong><span>бетон</span></div><div><strong>до 54 шт./цикл</strong><span>изделия</span></div><div><strong>2 × CO-NELE</strong><span>смесители</span></div><div><strong>SmartMix</strong><span>автоматизация</span></div></div><a class=\"button outline model-request\" href=\"#contact\" data-model=\"SmartBeton 60 S + QUNFENG QS 1500\">Запросить конфигурацию →</a></div></article><article class=\"model-card\"><div class=\"model-media\"><span>Промышленная линия</span><strong>90 S</strong></div><div class=\"model-body\"><h3>SmartBeton 90 S</h3><p class=\"press\">Вибропресс QUNFENG QS 2000</p><div class=\"model-specs\"><div><strong>до 40 м³/ч</strong><span>бетон</span></div><div><strong>до 66 шт./цикл</strong><span>изделия</span></div><div><strong>2 × CO-NELE</strong><span>смесители</span></div><div><strong>SmartMix</strong><span>автоматизация</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"SmartBeton 90 S + QUNFENG QS 2000\">Запросить конфигурацию →</a></div></article></div><div class=\"more-models\"><strong>Также доступны конфигурации 15 S / 25 S / 50 S / 70 S</strong><span>Подбор выполняется после уточнения изделия, формы, цикла и объёма выпуска.</span></div></div></section>\n\n    <section class=\"section economy\" id=\"economy\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Экономика проекта</p><h2>Управляемая себестоимость и выход на плановую мощность</h2><p>В буклете приведены ориентиры для комплексно спроектированной линии. Для проекта в Казахстане показатели подтверждаются индивидуальным технико-экономическим расчётом.</p></div><div class=\"economy-grid\"><article class=\"economy-card\"><strong>12–16</strong><h3>месяцев окупаемости</h3><p>Расчётный ориентир при согласованной загрузке, продуктовой программе и рыночной цене.</p></article><article class=\"economy-card\"><strong>до −15%</strong><h3>расход цемента</h3><p>Лабораторный подбор рецептуры под местное сырьё и автоматическое дозирование.</p></article><article class=\"economy-card\"><strong>до −20%</strong><h3>операционные расходы</h3><p>Автоматизация, снижение влияния человеческого фактора и энергоэффективные узлы.</p></article><article class=\"economy-card\"><strong>85–95%</strong><h3>целевая загрузка</h3><p>Синхронизированная работа БСУ, вибропресса и участков последующей обработки.</p></article></div><p class=\"economy-note\">Показатели не являются гарантией и зависят от сырья, рецептуры, ассортимента, режима работы, цен и фактической загрузки предприятия.</p></div></section>\n\n    <section class=\"section products\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Готовая продукция</p><h2>Одна линия — широкая номенклатура ВПИ</h2><p>Виды изделий определяются пресс-формой, рецептурой, количеством слоёв и выбранной моделью вибропресса.</p></div><div class=\"product-grid\"><article class=\"product\"><span>01</span><h3>Тротуарная плитка</h3><p>Однослойные и двухслойные изделия разных форматов.</p></article><article class=\"product\"><span>02</span><h3>Брусчатка</h3><p>Дорожные и ландшафтные изделия с лицевым слоем.</p></article><article class=\"product\"><span>03</span><h3>Бордюры</h3><p>Бортовой камень и элементы городского благоустройства.</p></article><article class=\"product\"><span>04</span><h3>Стеновые блоки</h3><p>Пустотные и полнотелые строительные изделия.</p></article></div></div></section>\n\n    <section class=\"contact\" id=\"contact\"><div class=\"container contact-grid\"><div class=\"contact-copy\"><p class=\"eyebrow light\">Расчёт линии для Казахстана</p><h2>Получите конфигурацию QUNFENG + ТТС под ваш продукт</h2><p>Инженер уточнит виды изделий, объём выпуска, местное сырьё и параметры площадки, затем подготовит состав линии и исходные данные для расчёта.</p><ul class=\"contact-points\"><li>Модель SmartBeton и вибропресса QUNFENG</li><li>Состав пресс-форм и околопрессового оборудования</li><li>Автоматизация, монтаж, запуск и обучение</li></ul></div><div class=\"form-card\"><form id=\"vpiForm\"><h3>Запросить расчёт линии</h3><p>Укажите контакты и известные параметры проекта.</p><label>Интересующая конфигурация<input id=\"modelField\" name=\"model\" value=\"Подобрать по задаче\"></label><label>Ваше имя<input required name=\"name\" placeholder=\"Имя Фамилия\"></label><label>Телефон для связи<input required name=\"phone\" placeholder=\"+7 (___) ___-__-__\"></label><label>Изделия и план выпуска<textarea name=\"comment\" placeholder=\"Плитка, брусчатка, бордюр, блоки; требуемая производительность\"></textarea></label><label class=\"consent\"><input type=\"checkbox\" required><span>Я согласен на обработку персональных данных.</span></label><button class=\"button primary full\" type=\"submit\">Получить консультацию →</button></form><div class=\"success\" id=\"success\"><h3>Заявка подготовлена</h3><p>В рабочей версии она будет передана инженеру вместе с выбранной конфигурацией.</p><a class=\"button outline\" href=\"#models\">Вернуться к линейке</a></div></div></div></section>\n  </main>\n\n  <footer class=\"footer\"><div class=\"container\"><div class=\"footer-inner\"><div><strong style=\"color:#fff\">QUNFENG + ТТС Инжиниринг</strong><br><span>Готовые линии ВПИ для Казахстана</span></div><a href=\"ТТС_прототип_лендинга_Казахстан.html\">← Вернуться на главную</a></div><div class=\"footer-bottom\"><span>© 2026 ТТС Инжиниринг Казахстан</span><span>Прототип страницы направления ВПИ</span></div></div></footer>\n\n  <script>\n    const modelField=document.getElementById('modelField');\n    document.querySelectorAll('.model-request').forEach(link=>link.addEventListener('click',()=>{modelField.value=link.dataset.model||'Подобрать по задаче'}));\n    document.querySelectorAll('a[href^=\"#\"]').forEach(anchor=>anchor.addEventListener('click',event=>{const id=decodeURIComponent(anchor.getAttribute('href').slice(1));if(!id)return;const target=document.getElementById(id);if(!target)return;event.preventDefault();target.scrollIntoView({behavior:'smooth',block:'start'})}));\n    document.getElementById('vpiForm').addEventListener('submit',event=>{event.preventDefault();event.currentTarget.style.display='none';document.getElementById('success').classList.add('visible')});\n  <\/script>\n</body>\n</html>\n","ТТС_каталог_цементных_терминалов.html":"<!doctype html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <title>Цементные терминалы SmartStock — каталог для Казахстана</title textarea{min-height:78px;resize:vertical}.consent{grid-template-columns:20px 1fr!important;align-items:start}.consent input{width:18px;height:18px;margin-top:2px}.full{width:100%;margin-top:20px}.success{min-height:490px;display:none;place-items:center;align-content:center;text-align:center}.success.visible{display:grid}.success>span{width:70px;height:70px;display:grid;place-items:center;color:#fff;background:var(--g700);border-radius:50%;font-size:30px}.success h3{margin:20px 0 8px}.success p{max-width:390px;color:var(--muted)}.footer{padding:55px 0 25px;color:rgba(255,255,255,.66);background:#0c251d}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:30px}.footer a{color:#fff;text-decoration:none;font-size:13px}.footer-bottom{margin-top:35px;padding-top:20px;display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.13);font-size:11px}\n    @media(max-width:980px){.hero-grid,.contact-grid{grid-template-columns:1fr}.capacity-grid,.equipment-grid{grid-template-columns:repeat(2,1fr)}.flow-line{grid-template-columns:repeat(3,1fr)}.benefit-grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.metrics div:nth-child(2){border-right:0}.nav{display:none}}\n    @media(max-width:640px){.container{width:min(100% - 30px,1240px)}.topline-inner span:last-child{display:none}.header-inner{min-height:82px}.brand-mark{width:46px;height:46px}.header .button{display:none}.hero{padding:35px 0 62px}h1{font-size:43px}h2{font-size:40px}.hero-copy>p:not(.eyebrow){font-size:17px}.hero-buttons,.hero-buttons .button{width:100%}.hero-placeholder{min-height:360px}.metrics,.capacity-grid,.route-grid,.flow-line,.benefit-grid,.equipment-grid{grid-template-columns:1fr}.metrics div{border-right:0}.section{padding:76px 0}.contact{padding:76px 0}.contact-grid{gap:42px}.form-card{padding:28px 22px}.footer-inner,.footer-bottom{align-items:flex-start;flex-direction:column}}\n  </style>\n<style data-monochrome-theme>\n    :root{--g950:#0b0b0b;--g900:#171717;--g800:#292929;--g700:#444;--cream:#e8e8e6;--cream2:#f5f5f3;--paper:#fff;--gold:#666;--gold2:#d0d0d0;--ink:#181818;--muted:#666;--line:#cececa;--shadow:0 24px 70px rgba(0,0,0,.14)}\n    html{filter:grayscale(1)}\n  </style></head>\n<body>\n  <div class=\"topline\"><div class=\"container topline-inner\"><span>Инжиниринг для строительной индустрии Казахстана с 2006 года</span><span>Автоматизация терминала · техподдержка 24/7</span></div></div>\n  <header class=\"header\"><div class=\"container header-inner\"><a class=\"brand\" href=\"ТТС_прототип_лендинга_Казахстан.html\"><span class=\"brand-mark\">ТТС</span><span><strong>ТТС Инжиниринг</strong><small>Казахстан</small></span></a><nav class=\"nav\"><a href=\"#capacity\">Вместимость</a><a href=\"#routes\">Тип подачи</a><a href=\"#benefits\">Преимущества</a><a href=\"#equipment\">Оснащение</a></nav><a class=\"button primary\" href=\"#contact\">Получить расчёт</a></div></header>\n\n  <main>\n    <div class=\"container breadcrumb\"><a href=\"ТТС_прототип_лендинга_Казахстан.html\">Главная</a> &nbsp;/&nbsp; Каталог оборудования &nbsp;/&nbsp; Цементные терминалы</div>\n\n    <section class=\"hero\"><div class=\"container hero-grid\"><div class=\"hero-copy\"><p class=\"eyebrow\">Комплексы под ключ для Казахстана</p><h1>Цементные терминалы SmartStock</h1><p>Индивидуально спроектированные и полностью автоматизированные комплексы, которые интегрируются в действующее производство и обеспечивают логистику и хранение цемента — от вагона-хоппера до цементовоза или производственного цеха.</p><div class=\"hero-buttons\"><a class=\"button primary\" href=\"#capacity\">Выбрать вместимость →</a><a class=\"button outline\" href=\"#contact\">Получить схему терминала</a></div></div><div class=\"hero-frame\"><div class=\"hero-placeholder\" aria-label=\"Место для фотографии цементного терминала\"></div><div class=\"hero-note\">Приёмка · хранение · отгрузка</div></div></div></section>\n\n    <div class=\"container metrics\"><div><strong>1000–5000</strong><span>тонн полезной вместимости</span></div><div><strong>ж/д + авто</strong><span>приём цемента на терминале</span></div><div><strong>до 4</strong><span>марок цемента одновременно</span></div><div><strong>90</strong><span>рабочих дней — средний срок выпуска</span></div></div>\n\n    <section class=\"section\" id=\"capacity\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Вместимость SmartStock</p><h2>Выберите масштаб хранения</h2><p>Полезная ёмкость, число силосов, марки цемента и схема отгрузки уточняются при проектировании. Каждый вариант адаптируется к логистике и ограничениям площадки.</p></div><div class=\"capacity-grid\"><article class=\"capacity\"><strong>1000</strong><span>тонн</span><p>Компактный терминал или интеграция с действующим производством.</p><a class=\"button outline capacity-request\" href=\"#contact\" data-capacity=\"1000 тонн\">Запросить расчёт</a></article><article class=\"capacity\"><strong>2000</strong><span>тонн</span><p>Средний запас для производственной площадки или региональной дистрибуции.</p><a class=\"button outline capacity-request\" href=\"#contact\" data-capacity=\"2000 тонн\">Запросить расчёт</a></article><article class=\"capacity\"><strong>3000</strong><span>тонн</span><p>Промышленный склад с несколькими марками и гибкими маршрутами отгрузки.</p><a class=\"button outline capacity-request\" href=\"#contact\" data-capacity=\"3000 тонн\">Запросить расчёт</a></article><article class=\"capacity\"><strong>5000</strong><span>тонн</span><p>Крупный распределительный комплекс для масштабной логистики цемента.</p><a class=\"button primary capacity-request\" href=\"#contact\" data-capacity=\"5000 тонн\">Запросить расчёт</a></article></div></div></section>\n\n    <section class=\"section routes\" id=\"routes\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Две технологические ветки</p><h2>Как подать цемент из вагона-хоппера</h2><p>Типовой вагон-хоппер вмещает около 65 тонн. Способ разгрузки выбирается по расстояниям, свободному месту, препятствиям и требованиям к обслуживанию.</p></div><div class=\"route-grid\"><article class=\"route-card\"><span>Механическая подача</span><h3>Шнековый транспортёр + нория</h3><p>Более быстрая и экономичная подача, но с большим количеством механических узлов для обслуживания. Оптимальна, когда силосы расположены рядом с терминалом и есть место для размещения оборудования.</p><div class=\"route-meta\"><div><strong>Оптимально</strong><small>новая площадка и свободная планировка</small></div><div><strong>Сильная сторона</strong><small>скорость разгрузки и стоимость</small></div></div></article><article class=\"route-card\"><span>Пневматическая подача</span><h3>2 × ПКН</h3><p>Разгрузка занимает больше времени, но система проще в обслуживании. Пневмотрасса позволяет подавать цемент на 200–300 метров и обходить существующие здания и другие препятствия.</p><div class=\"route-meta\"><div><strong>Оптимально</strong><small>ограниченное пространство и плотная застройка</small></div><div><strong>Сильная сторона</strong><small>гибкая трасса и расстояние</small></div></div></article></div></div></section>\n\n    <section class=\"section flow\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Логика комплекса</p><h2>От приёмки до отгрузки</h2><p>АСУ связывает входные и выходные участки терминала в единый технологический контур.</p></div><div class=\"flow-line\"><article class=\"flow-card\"><span>01</span><h3>Приём транспорта</h3><p>Железнодорожные вагоны-хопперы или автомобильный транспорт.</p></article><article class=\"flow-card\"><span>02</span><h3>Разгрузка</h3><p>Приямок, приёмный бункер и аспирация точки входа.</p></article><article class=\"flow-card\"><span>03</span><h3>Транспортирование</h3><p>Механическая ветка или пневмоподача до выбранных силосов.</p></article><article class=\"flow-card\"><span>04</span><h3>Хранение</h3><p>Контроль уровня и распределение до четырёх марок цемента.</p></article><article class=\"flow-card\"><span>05</span><h3>Отгрузка</h3><p>Телескопический загрузчик, автовесы или подача в производственный цех.</p></article></div></div></section>\n\n    <section class=\"section\" id=\"benefits\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Основные преимущества</p><h2>Терминал как управляемая система</h2><p>Проектирование охватывает технологию, бизнес-логику потоков, обслуживание и интеграцию с действующей площадкой.</p></div><div class=\"benefit-grid\"><article class=\"benefit\"><span>01</span><h3>Комплексная автоматизация</h3><p>Собственная АСУ управляет точкой входа — приямком, бункером и аспирацией — и точкой выхода: силосами, загрузчиком и автовесами.</p></article><article class=\"benefit\"><span>02</span><h3>Прозрачность для владельца</h3><p>Остатки доступны в реальном времени по данным ж/д-весов, автовесов и расчётному уровню в силосах — без выезда на площадку.</p></article><article class=\"benefit\"><span>03</span><h3>Сложные проекты</h3><p>Управление потоками разных марок, работа в сложных климатических условиях и реализация нестандартных схем дистрибуции.</p></article><article class=\"benefit\"><span>04</span><h3>Широкое оснащение</h3><p>Автовесы, силосы на высоких опорах, ковшовый элеватор, телескопические загрузчики и аспирация.</p></article><article class=\"benefit\"><span>05</span><h3>Удобство эксплуатации</h3><p>Площадки обслуживания загрузчиков, головки элеватора, фильтров и аварийного обеспыливания закладываются при конструировании.</p></article><article class=\"benefit\"><span>06</span><h3>Срок реализации</h3><p>Средний срок выпуска цементного терминала SmartStock составляет 90 рабочих дней.</p></article></div></div></section>\n\n    <section class=\"section equipment\" id=\"equipment\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Оснащение терминала</p><h2>Оборудование в составе проекта</h2><p>Фактический набор узлов определяется выбранной схемой приёмки, хранения, внутренней логистики и отгрузки.</p></div><div class=\"equipment-grid\"><article class=\"equipment-card\"><span>01</span><h3>Приёмный узел</h3><p>Приямок, бункер, разгрузочные устройства и аспирация.</p></article><article class=\"equipment-card\"><span>02</span><h3>Силосы</h3><p>Требуемый объём, число марок и вариант высоких опор.</p></article><article class=\"equipment-card\"><span>03</span><h3>Механическая подача</h3><p>Шнеки, ковшовый элеватор и распределительные устройства.</p></article><article class=\"equipment-card\"><span>04</span><h3>Пневмоподача</h3><p>Два пневмокамерных насоса и трубопроводная трасса.</p></article><article class=\"equipment-card\"><span>05</span><h3>Отгрузка</h3><p>Телескопические загрузчики для цементовозов.</p></article><article class=\"equipment-card\"><span>06</span><h3>Весовой контроль</h3><p>Железнодорожные и автомобильные весы.</p></article><article class=\"equipment-card\"><span>07</span><h3>Аспирация</h3><p>Фильтры силосов и аварийное обеспыливание.</p></article><article class=\"equipment-card\"><span>08</span><h3>АСУ терминала</h3><p>Маршрутизация потоков, остатки и контроль операций.</p></article></div></div></section>\n\n    <section class=\"contact\" id=\"contact\"><div class=\"container contact-grid\"><div class=\"contact-copy\"><p class=\"eyebrow\">Обсудим проект</p><h2>Получите схему SmartStock</h2><p>Инженер уточнит вместимость, число марок цемента, вид транспорта, расстояние до силосов и ограничения площадки, затем предложит технологическую ветку и состав оборудования.</p><div class=\"contact-details\"><strong>Филиал ТТС Инжиниринг в Казахстане</strong><span>Алматы, ул. Казыбек Би, 22, офис 302</span><span>Техническая поддержка АСУ ТП — 24/7</span></div></div><div class=\"form-card\"><form id=\"terminalForm\"><h3>Оставьте исходные данные</h3><p>Это прототип формы. В рабочей версии заявка будет передаваться инженеру.</p><label>Вместимость<input id=\"capacityField\" name=\"capacity\" value=\"Подобрать по грузообороту\"></label><label>Предпочтительная подача<select name=\"feed\"><option>Требуется подбор</option><option>Механическая — шнек + нория</option><option>Пневматическая — 2 × ПКН</option></select></label><label>Ваше имя<input required name=\"name\" placeholder=\"Имя Фамилия\"></label><label>Телефон для связи<input required name=\"phone\" placeholder=\"+7 (___) ___-__-__\"></label><label>Комментарий<textarea name=\"comment\" placeholder=\"Число марок, транспорт, расстояния и условия площадки\"></textarea></label><label class=\"consent\"><input type=\"checkbox\" required><span>Я согласен на обработку персональных данных.</span></label><button class=\"button gold full\" type=\"submit\">Получить консультацию →</button></form><div class=\"success\" id=\"success\"><span>✓</span><h3>Заявка подготовлена</h3><p>В рабочей версии данные будут переданы инженеру вместе с выбранной вместимостью и рекламным источником.</p><a class=\"button outline\" href=\"#capacity\">Вернуться к вместимости</a></div></div></div></section>\n  </main>\n\n  <footer class=\"footer\"><div class=\"container\"><div class=\"footer-inner\"><div><strong>ТТС Инжиниринг Казахстан</strong><br><span>Заводы, терминалы и технологические линии</span></div><a href=\"ТТС_прототип_лендинга_Казахстан.html\">← Вернуться на главную</a></div><div class=\"footer-bottom\"><span>© 2026 ТТС Инжиниринг Казахстан</span><span>Каталог цементных терминалов SmartStock</span></div></div></footer>\n\n  <script>\n    const capacityField=document.getElementById('capacityField');\n    document.querySelectorAll('.capacity-request').forEach(link=>link.addEventListener('click',()=>{capacityField.value=link.dataset.capacity||'Подобрать по грузообороту'}));\n    document.getElementById('terminalForm').addEventListener('submit',event=>{event.preventDefault();event.currentTarget.style.display='none';document.getElementById('success').classList.add('visible')});\n  <\/script>\n</body>\n</html>\n","ТТС_каталог_пнев 1>Пневмокамерные насосы</h1><p>Перемещают цемент и другие сыпучие и порошкообразные материалы сжатым воздухом. Применяются в строительной, пищевой и химической промышленности.</p><div class=\"hero-buttons\"><a class=\"button primary\" href=\"#models\">Смотреть модели →</a><a class=\"button outline\" href=\"#contact\">Рассчитать трассу подачи</a></div></div><div class=\"hero-frame\"><div class=\"hero-placeholder\" aria-label=\"Место для фотографии пневмокамерного насоса\"></div><div class=\"hero-note\">Вертикальное исполнение · шкаф управления в комплекте</div></div></div></section>\n\n    <div class=\"container metrics\"><div><strong>10–60</strong><span>т/ч — производительность в зависимости от модели</span></div><div><strong>до 250</strong><span>метров — дальность подачи по трассе</span></div><div><strong>до 30</strong><span>метров — высота подачи материала</span></div><div><strong>4 м</strong><span>сокращённый разгонный участок</span></div></div>\n\n    <section class=\"section\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Области применения</p><h2>Подача материала там, где механический транспорт неудобен</h2><p>Трассу можно провести на значительное расстояние и в обход препятствий. Подбор начинается с материала, требуемой производительности, длины и высоты маршрута.</p></div><div class=\"applications-grid\"><article class=\"application-card\"><span>01</span><h3>Строительная промышленность</h3><p>Подача цемента и сухих компонентов на бетонных заводах, цементных терминалах, предприятиях ЖБИ и производствах сухих смесей.</p><b>Основное применение — цемент</b></article><article class=\"application-card\"><span>02</span><h3>Пищевая промышленность</h3><p>Перемещение совместимых порошкообразных и мелкозернистых материалов в закрытой транспортной системе.</p><b>Конфигурация зависит от материала</b></article><article class=\"application-card\"><span>03</span><h3>Химическая промышленность</h3><p>Транспортировка совместимых сыпучих компонентов между технологическими участками предприятия.</p><b>Проверка свойств среды обязательна</b></article></div></div></section>\n\n    <section class=\"section principle\" id=\"principle\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Принцип работы</p><h2>Сжатый воздух перемещает материал по трубопроводу</h2><p>Материал загружается в герметичную камеру. Воздух создаёт рабочее давление, переводит продукт в подвижное состояние и выталкивает его по заданной трассе с относительно низким расходом энергии.</p></div><div class=\"principle-grid\"><article class=\"principle-card\"><span>01 · ЗАГРУЗКА</span><h3>Заполнение камеры</h3><p>Сыпучий материал поступает в вертикальную камеру насоса через загрузочный узел.</p></article><article class=\"principle-card\"><span>02 · ГЕРМЕТИЗАЦИЯ</span><h3>Закрытие затвора</h3><p>Дисковый затвор закрывает камеру перед подачей сжатого воздуха.</p></article><article class=\"principle-card\"><span>03 · ДАВЛЕНИЕ</span><h3>Подготовка материала</h3><p>Сжатый воздух воздействует на материал и формирует условия для его движения.</p></article><article class=\"principle-card\"><span>04 · ТРАНСПОРТ</span><h3>Подача по трассе</h3><p>Материал выталкивается по трубопроводу на расстояние до 250 м и высоту до 30 м.</p></article></div></div></section>\n\n    <section class=\"section models\" id=\"models\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Линейка оборудования</p><h2>Модели ПКН производительностью от 10 до 60 т/ч</h2><p>Ниже — ориентиры для предварительного выбора. Исполнение, привод и фактическая производительность подтверждаются после расчёта материала, трассы и имеющейся компрессорной системы.</p></div><div class=\"model-grid\">\n      <article class=\"model-card\"><div class=\"model-photo\" aria-label=\"Место для фотографии ПКН Т10\"><b>Начальная модель</b><span>Т10</span></div><div class=\"model-body\"><h3>Пневмокамерный насос Т10</h3><p>Решение для небольшого расхода материала и локальных производственных задач.</p><div class=\"model-specs\"><div><strong>10 т/ч</strong><span>производительность</span></div><div><strong>вертикальное</strong><span>исполнение</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"ПКН Т10\">Подобрать Т10 →</a></div></article>\n      <article class=\"model-card\"><div class=\"model-photo\" aria-label=\"Место для фотографии ПКН Т20\"><b>Средний расход</b><span>Т20</span></div><div class=\"model-body\"><h3>Пневмокамерный насос Т20</h3><p>Универсальная модель для задач с требуемой производительностью до 20 тонн материала в час.</p><div class=\"model-specs\"><div><strong>20 т/ч</strong><span>производительность</span></div><div><strong>вертикальное</strong><span>исполнение</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"ПКН Т20\">Подобрать Т20 →</a></div></article>\n      <article class=\"model-card\"><div class=\"model-photo\" aria-label=\"Место для фотографии ПКН Т40\"><b>Промышленный</b><span>Т40</span></div><div class=\"model-body\"><h3>Пневмокамерный насос Т40</h3><p>Производительное исполнение для бетонных заводов, терминалов и других промышленных объектов.</p><div class=\"model-specs\"><div><strong>40 т/ч</strong><span>производительность</span></div><div><strong>вертикальное</strong><span>исполнение</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"ПКН Т40\">Подобрать Т40 →</a></div></article>\n      <article class=\"model-card\"><div class=\"model-photo\" aria-label=\"Место для фотографии ПКН Т40Н\"><b>Модифицированный</b><span>Т40Н</span></div><div class=\"model-body\"><h3>Пневмокамерный насос Т40Н</h3><p>Модифицированное исполнение производительностью до 40 т/ч. Точный состав подбирается под узел установки.</p><div class=\"model-specs\"><div><strong>40 т/ч</strong><span>производительность</span></div><div><strong>индивидуально</strong><span>привязка к объекту</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"ПКН Т40Н\">Подобрать Т40Н →</a></div></article>\n      <article class=\"model-card\"><div class=\"model-photo\" aria-label=\"Место для фотографии ПКН Т60\"><b>Максимальная модель</b><span>Т60</span></div><div class=\"model-body\"><h3>Пневмокамерный насос Т60</h3><p>Старшая модель линейки для высокой загрузки и производительности до 60 тонн материала в час.</p><div class=\"model-specs\"><div><strong>60 т/ч</strong><span>производительность</span></div><div><strong>вертикальное</strong><span>исполнение</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"ПКН Т60\">Подобрать Т60 →</a></div></article>\n    </div></div></section>\n\n    <section class=\"section\" id=\"specs\"><div class=\"container spec-layout\"><div class=\"delivery-panel\"><p class=\"eyebrow\" style=\"color:var(--gold2)\">Готовность к монтажу</p><h2>Поставка в собранном виде</h2><p>Насос комплектуется шкафом управления с уже заданными настройками. На площадке остаётся установить оборудование, подключить коммуникации и выполнить пусконаладку.</p><ul class=\"delivery-list\"><li>Вертикальное исполнение</li><li>Шкаф управления в комплекте</li><li>Предварительно заданные настройки</li><li>Минимум операций при установке</li><li>Гарантия 2 года</li></ul></div><div><p class=\"eyebrow\">Общие характеристики</p><h2>Исходные параметры для подбора</h2><div class=\"spec-table\"><div class=\"spec-row\"><span>Производительность</span><strong>10–60 т/ч, в зависимости от модели</strong></div><div class=\"spec-row\"><span>Дальность подачи</span><strong>до 250 м</strong></div><div class=\"spec-row\"><span>Высота подачи</span><strong>до 30 м</strong></div><div class=\"spec-row\"><span>Разгонный участок</span><strong>4 м</strong></div><div class=\"spec-row\"><span>Электропитание</span><strong>380 В / 50 Гц</strong></div><div class=\"spec-row\"><span>Сжатый воздух</span><strong>0,6 МПа, 5–12 м³/мин</strong></div><div class=\"spec-row\"><span>Комплектация</span><strong>в сборе, со шкафом управления</strong></div><div class=\"spec-row\"><span>Гарантия</span><strong>2 года</strong></div></div></div></div></section>\n\n    <section class=\"section construction\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Конструкция ПКН</p><h2>Узлы для управляемой и герметичной подачи</h2><p>Конструкция рассчитана на сокращение монтажного времени, стабильное управление потоком и работу под механическими нагрузками.</p></div><div class=\"construction-grid\"><article class=\"construction-card\"><span>01</span><h3>Разгонный участок — 4 м</h3><p>Сокращённая длина без потери производительности уменьшает требования к свободному пространству на объекте.</p></article><article class=\"construction-card\"><span>02</span><h3>Дисковый затвор</h3><p>Ручной или пневматический привод позволяет выбрать подходящий уровень автоматизации и точно регулировать подачу.</p></article><article class=\"construction-card\"><span>03</span><h3>Клапаны и датчики</h3><p>Электромагнитные клапаны и датчики положения контролируют процесс и помогают исключить утечки материала.</p></article><article class=\"construction-card\"><span>04</span><h3>Стальной корпус</h3><p>Корпус из углеродистой стали устойчив к механическим нагрузкам промышленной эксплуатации.</p></article></div></div></section>\n\n    <section class=\"section\" id=\"components\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Пневматика ведущих производителей</p><h2>Комплектующие Camozzi и SMC</h2><p>Каталожные компоненты обеспечивают повторяемость характеристик и возможность гарантированной замены при обслуживании оборудования.</p></div><div class=\"components-grid\"><article class=\"component-card\"><div class=\"component-country\">Италия</div><h3>Camozzi</h3><ul><li>Пневмоцилиндры серии 40M2</li><li>Магнитные датчики положения CSN</li><li>Цанговая пневмофурнитура S6520</li></ul></article><article class=\"component-card\"><div class=\"component-country\">Япония</div><h3>SMC</h3><ul><li>Соленоидные клапаны серии VXD</li><li>Условный проход ДУ50</li><li>Исполнение 2/2-ходовое</li></ul></article></div></div></section>\n\n    <section class=\"section integration\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Варианты интеграции</p><h2>Под объект и точку загрузки</h2><p>ПКН можно подобрать как отдельное оборудование или как часть комплексной схемы приёма, хранения и распределения сыпучих материалов.</p></div><div class=\"integration-grid\"><article class=\"integration-card\"><span>01</span><h3>Под силосы</h3><p>Подача материала от точки выгрузки к силосному парку или между участками хранения.</p></article><article class=\"integration-card\"><span>02</span><h3>Под хопперы</h3><p>Интеграция в узел приёма сыпучего материала с учётом производительности разгрузки.</p></article><article class=\"integration-card\"><span>03</span><h3>Под вагоны</h3><p>Применение в технологической ветке разгрузки железнодорожного транспорта.</p></article><article class=\"integration-card\"><span>04</span><h3>Под растариватель</h3><p>Подача материала после разгрузки мягких контейнеров в дальнейший производственный маршрут.</p></article></div></div></section>\n\n    <section class=\"contact\" id=\"contact\"><div class=\"container contact-grid\"><div class=\"contact-copy\"><p class=\"eyebrow\" style=\"color:var(--gold2)\">Инженерный подбор</p><h2>Подберём ПКН и проверим трассу подачи</h2><p>Для расчёта нужны материал, требуемая производительность, расстояние, высота, схема трассы и параметры существующей компрессорной системы.</p><div class=\"contact-details\"><strong>Филиал ТТС Инжиниринг в Казахстане</strong><span>Алматы, ул. Казыбек Би, 22, офис 302</span><span>Поставка оборудования и техническое сопровождение проектов</span></div></div><div class=\"form-card\"><form id=\"pknForm\"><h3>Оставьте исходные данные</h3><p>Это прототип формы. В рабочей версии заявка будет передаваться профильному инженеру.</p><label>Модель<input id=\"modelField\" name=\"model\" value=\"Подобрать индивидуально\"></label><label>Материал<input name=\"material\" placeholder=\"Например: цемент\"></label><label>Требуемая производительность<select name=\"capacity\"><option>Требуется подобрать</option><option>До 10 т/ч</option><option>До 20 т/ч</option><option>До 40 т/ч</option><option>До 60 т/ч</option></select></label><div class=\"form-row\"><label>Длина трассы<input name=\"distance\" placeholder=\"м\"></label><label>Высота подачи<input name=\"height\" placeholder=\"м\"></label></div><label>Ваше имя<input required name=\"name\" placeholder=\"Имя Фамилия\"></label><label>Телефон для связи<input required name=\"phone\" placeholder=\"+7 (___) ___-__-__\"></label><label>Комментарий<textarea name=\"comment\" placeholder=\"Опишите трассу, точку загрузки и имеющийся компрессор\"></textarea></label><label class=\"consent\"><input type=\"checkbox\" required><span>Я согласен на обработку персональных данных.</span></label><button class=\"button gold full\" type=\"submit\">Получить подбор ПКН →</button></form><div class=\"success\" id=\"success\"><span>✓</span><h3>Заявка подготовлена</h3><p>В рабочей версии данные будут переданы инженеру вместе с выбранной моделью и параметрами трассы.</p><a class=\"button outline\" href=\"#models\">Вернуться к моделям</a></div></div></div></section>\n  </main>\n\n  <footer class=\"footer\"><div class=\"container\"><div class=\"footer-inner\"><div><strong>ТТС Инжиниринг Казахстан</strong><br><span>Пневмотранспорт и оборудование для строительной индустрии</span></div><a href=\"ТТС_прототип_лендинга_Казахстан.html\">← Вернуться на главную</a></div><div class=\"footer-bottom\"><span>© 2026 ТТС Инжиниринг Казахстан</span><span>Каталог пневмокамерных насосов</span></div></div></footer>\n\n  <script>\n    const modelField=document.getElementById('modelField');\n    document.querySelectorAll('.model-request').forEach(link=>link.addEventListener('click',()=>{modelField der class=\"header\"><div class=\"container header-inner\"><a class=\"brand\" href=\"ТТС_прототип_лендинга_Казахстан.html\"><span class=\"brand-mark\">ТТС</span><span><strong>ТТС Инжиниринг</strong><small>Казахстан</small></span></a><nav class=\"nav\"><a href=\"ТТС_прототип_лендинга_Казахстан.html#catalog\">Оборудование</a><a href=\"ТТС_общий_каталог_оборудования.html\">Каталог</a><a href=\"ТТС_инженерный_сервис.html\">Сервис</a><a href=\"ТТС_запасные_части_и_автоматика.html\">Запчасти</a><a href=\"ТТС_прототип_лендинга_Казахстан.html#company\">О компании</a></nav><a class=\"header-cta\" href=\"#request\">Запросить сервис</a></div></header>\n  <main>\n    <div class=\"container breadcrumbs\"><a href=\"ТТС_прототип_лендинга_Казахстан.html\">Главная</a> / Инженерный сервис</div>\n    <section class=\"hero\"><div class=\"container hero-grid\"><div><p class=\"eyebrow\">Сервис промышленного оборудования</p><h1>Инженерный сервис на всём сроке эксплуатации</h1><p class=\"lead\">Сопровождаем бетонные заводы, линии сухих смесей, цементные терминалы, оборудование ВПИ и собственную автоматизацию — от первого запуска до планового обслуживания и срочной помощи.</p><div class=\"button-row\"><a class=\"button primary\" href=\"#request\">Оставить заявку →</a><a class=\"button outline\" href=\"ТТС_запасные_части_и_автоматика.html\">Нужны запчасти</a></div></div><div class=\"hero-media\" aria-label=\"Место для фотографии сервисного инженера\"></div></div></section>\n    <div class=\"container facts\"><div class=\"fact\"><strong>24/7</strong><span>техническая поддержка</span></div><div class=\"fact\"><strong>Полный цикл</strong><span>диагностика, запуск и обслуживание</span></div><div class=\"fact\"><strong>Один подрядчик</strong><span>механика, электрика и собственная АСУ</span></div></div>\n    <section class=\"section\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Полный цикл поддержки</p><h2>Сервис для стабильной работы производства</h2><p>Инженер оценивает не отдельный узел, а всю технологическую цепочку — оборудование, датчики, исполнительные механизмы, шкафы управления и программную часть.</p></div><div class=\"service-grid\"><article class=\"service-item\"><span>01</span><h3>Технический аудит</h3><p>Обследование объекта, диагностика оборудования и определение причин отклонений.</p></article><article class=\"service-item\"><span>02</span><h3>Шеф-монтаж</h3><p>Организационно-техническое руководство монтажом на площадке заказчика.</p></article><article class=\"service-item\"><span>03</span><h3>Пусконаладка</h3><p>Подключение, калибровка дозаторов, обкатка и пробный выпуск продукции.</p></article><article class=\"service-item\"><span>04</span><h3>Обучение персонала</h3><p>Передача оператору рабочих режимов, регламентов и правил эксплуатации.</p></article><article class=\"service-item\"><span>05</span><h3>Плановое обслуживание</h3><p>Регламентные проверки, профилактика и рекомендации по снижению риска простоев.</p></article><article class=\"service-item\"><span>06</span><h3>Срочная техпомощь</h3><p>Оперативная поддержка по механике, электрике и собственной системе автоматизации.</p></article></div></div></section>\n    <section class=\"section process\"><div class=\"container process-grid\"><div><p class=\"eyebrow\">Как начинается работа</p><h2>От заявки до восстановления процесса</h2><p class=\"lead\">Сначала фиксируем проявление проблемы и параметры линии, затем определяем формат диагностики и состав работ.</p></div><div class=\"process-list\"><div class=\"process-step\"><h3>Получаем исходные данные</h3><p>Тип оборудования, описание неисправности, сообщения АСУ, фото и видео с площадки.</p></div><div class=\"process-step\"><h3>Проводим диагностику</h3><p>Удалённо или с выездом инженера — в зависимости от характера задачи.</p></div><div class=\"process-step\"><h3>Согласовываем решение</h3><p>Перечень работ, необходимые комплектующие, сроки и условия выполнения.</p></div><div class=\"process-step\"><h3>Выполняем работы</h3><p>Настройка, ремонт или запуск с контрольной проверкой и рекомендациями персоналу.</p></div></div></div></section>\n    <section class=\"support-band\"><div class=\"container\"><div><h2>Сервис связан с поставкой запчастей</h2><p>Если требуется замена узла, инженер помогает идентифицировать деталь и проверить совместимость до поставки.</p></div><a class=\"button outline\" href=\"ТТС_запасные_части_и_автоматика.html\">Перейти к запчастям</a></div></section>\n    <section class=\"contact\" id=\"request\"><div class=\"container contact-grid\"><div class=\"contact-copy\"><p class=\"eyebrow\" style=\"color:var(--gold2)\">Заявка в сервис</p><h2>Опишите оборудование и задачу</h2><p>Инженер уточнит симптомы, параметры линии и срочность, после чего предложит следующий шаг.</p><div class=\"contact-details\"><strong>Филиал ТТС Инжиниринг в Казахстане</strong>Алматы, ул. Казыбек Би, 22, офис 302<br>Пн–Пт, 9:00–18:00 · техподдержка 24/7</div></div><div class=\"form-card\"><form id=\"serviceForm\"><h3>Запросить сервис</h3><p>Оставьте контакты и кратко опишите ситуацию.</p><label>Ваше имя<input required name=\"name\" placeholder=\"Имя Фамилия\"></label><label>Телефон<input required name=\"phone\" placeholder=\"+7 (___) ___-__-__\"></label><label>Оборудование и задача<textarea name=\"task\" placeholder=\"Модель, симптомы, сообщения системы управления\"></textarea></label><label class=\"consent\"><input type=\"checkbox\" required><span>Я согласен на обработку персональных данных.</span></label><button class=\"button primary full\" type=\"submit\">Получить консультацию →</button></form><div class=\"success\" id=\"serviceSuccess\"><h3>Заявка подготовлена</h3><p>В рабочей версии она будет передана специалисту сервисной службы.</p></div></div></div></section>\n  </main>\n  <footer class=\"footer\"><div class=\"container footer-grid\"><div><strong style=\"color:#fff\">ТТС Инжиниринг Казахстан</strong><p>Промышленное оборудование, автоматизация и сервис.</p></div><div><h4>Сервис    :root{--g950:#0b0b0b;--g900:#171717;--g800:#292929;--g700:#444;--cream:#e8e8e6;--cream2:#f5f5f3;--paper:#fff;--gold:#666;--gold2:#d0d0d0;--ink:#181818;--muted:#666;--line:#cececa;--shadow:0 24px 70px rgba(0,0,0,.14)}\n    html{filter:grayscale(1)}\n  </style></head>\n<body>\n  <div class=\"topline\"><div class=\"container\"><span>Инжиниринг для строительной индустрии Казахстана</span><span>Подбор комплектующих и автоматики</span></div></div>\n  <header class=\"header\"><div class=\"container header-inner\"><a class=\"brand\" href=\"ТТС_прототип_лендинга_Казахстан.html\"><span class=\"brand-mark\">ТТС</span><span><strong>ТТС Инжиниринг</strong><small>Казахстан</small></span></a><nav class=\"nav\"><a href=\"ТТС_прототип_лендинга_Казахстан.html#catalog\">Оборудование</a><a href=\"ТТС_общий_каталог_оборудования.html\">Каталог</a><a href=\"ТТС_инженерный_сервис.html\">Сервис</a><a href=\"ТТС_запасные_части_и_автоматика.html\">Запчасти</a><a href=\"ТТС_прототип_лендинга_Казахстан.html#company\">О компании</a></nav><a class=\"header-cta\" href=\"#request\">Подобрать запчасть</a></div></header>\n  <main>\n    <div class=\"container breadcrumbs\"><a href=\"ТТС_прототип_лендинга_Казахстан.html\">Главная</a> / Запасные части и автоматика</div>\n    <section class=\"hero\"><div class=\"container hero-grid\"><div><p class=\"eyebrow\">Комплектующие для производства</p><h1>Запасные части и автоматика для промышленного оборудования</h1><p class=\"lead\">Подбираем узлы и компоненты по модели, спецификации, маркировке или фотографии. Проверяем совместимость и при необходимости связываем поставку с монтажом и настройкой.</p><div class=\"button-row\"><a class=\"button primary\" href=\"#request\">Отправить запрос →</a><a class=\"button outline\" href=\"ТТС_инженерный_сервис.html\">Нужен сервис</a></div></div><div class=\"hero-media\" aria-label=\"Место для фотографии склада комплектующих\"></div></div></section>\n    <section class=\"section\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Что поставляем</p><h2>Комплектующие для ключевых узлов производства</h2><p>Структура запроса построена вокруг оборудования ТТС: бетонные заводы, линии сухих смесей, цементные терминалы, пневмотранспорт, ВПИ и системы автоматизации.</p></div><div class=\"parts-grid\"><article class=\"part\"><span>01</span><h3>Смесители и рабочие органы</h3><p>Узлы смешивания и сменные элементы.</p></article><article class=\"part\"><span>02</span><h3>Шнеки и транспортёры</h3><p>Винты, секции, опоры и элементы приводов.</p></article><article class=\"part\"><span>03</span><h3>Затворы и клапаны</h3><p>Запорные узлы и исполнительные механизмы.</p></article><article class=\"part\"><span>04</span><h3>Пневматика</h3><p>Пневмоцилиндры, распределители и подготовка воздуха.</p></article><article class=\"part\"><span>05</span><h3>Датчики</h3><p>Уровень, влажность, положение и расход.</p></article><article class=\"part\"><span>06</span><h3>Приводы</h3><p>Электродвигатели, мотор-редукторы и редукторы.</p></article><article class=\"part\"><span>07</span><h3>Шкафы управления</h3><p>Компоненты управления, силовая часть и интерфейсы.</p></article><article class=\"part\"><span>08</span><h3>АСУ ТП</h3><p>Элементы собственной автоматизации и программная поддержка.</p></article></div></div></section>\n    <section class=\"section selection\"><div class=\"container selection-grid\"><div class=\"selection-copy\"><p class=\"eyebrow\" style=\"color:var(--gold2)\">Как ускорить подбор</p><h2>Чем точнее исходные данные, тем быстрее проверка совместимости</h2><p>Если точное обозначение неизвестно, отправьте доступные данные. Технический специалист сопоставит их с узлом оборудования и уточнит недостающие параметры.</p></div><div class=\"selection-list\"><div class=\"selection-item\"><span>01</span><strong>Модель оборудования</strong><p>Название линии, завода или отдельного узла.</p></div><div class=\"selection-item\"><span>02</span><strong>Маркировка детали</strong><p>Шильдик, артикул или обозначение производителя.</p></div><div class=\"selection-item\"><span>03</span><strong>Спецификация</strong><p>Чертёж, ведомость или фрагмент документации.</p></div><div class=\"selection-item\"><span>04</span><strong>Фото и размеры</strong><p>Общий вид, место установки и основные размеры.</p></div></div></div></section>\n    <section class=\"section flow\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Порядок работы</p><h2>От идентификации до установки</h2></div><div class=\"flow-grid\"><article class=\"flow-step\"><h3>Получаем запрос</h3><p>Фиксируем оборудование, деталь и срочность потребности.</p></article><article class=\"flow-step\"><h3>Проверяем совместимость</h3><p>Сверяем характеристики, присоединительные размеры и исполнение.</p></article><article class=\"flow-step\"><h3>Предлагаем вариант</h3><p>Согласовываем состав поставки и необходимые сопутствующие элементы.</p></article><article class=\"flow-step\"><h3>Поставляем и подключаем</h3><p>При необходимости выполняем монтаж, настройку и проверку работы.</p></article></div></div></section>\n    <section class=\"service-band\"><div class=\"container\"><div><h2>Запчасти можно заказать вместе с сервисом</h2><p>Инженер проведёт диагностику, определит нужный узел и проконтролирует его установку.</p></div><a class=\"button outline\" href=\"ТТС_инженерный_сервис.html\">Перейти к сервису →</a></div></section>\n    <section class=\"contact\" id=\"request\"><div class=\"container contact-grid\"><div class=\"contact-copy\"><p class=\"eyebrow\" style=\"color:var(--gold2)\">Запрос на подбор</p><h2>Отправьте данные оборудования или детали</h2><p>Технический специалист уточнит исполнение, проверит совместимость и предложит следующий шаг.</p><div class=\"contact-details\"><strong>Филиал ТТС Инжиниринг в Казахстане</strong>Алматы, ул. Казыбек Би, 22, офис 302<br>Пн–Пт, 9:00–18:00</div></div><div class=\"form-card\"><form id=\"partsForm\"><h3>Подобрать комплектующие</h3><p>Укажите контакты и всё, что известно о детали.</p><label>Ваше имя<input required name=\"name\" placeholder=\"Имя Фамилия\"></label><label>Телефон<input required name=\"phone\" placeholder=\"+7 (___) ___-__-__\"></label><label>Оборудование и деталь<textarea name=\"task\" placeholder=\"Модель, маркировка, размеры или описание\"></textarea></label><label class=\"consent\"><input type=\"checkbox\" required><span>Я согласен на обработку персональных данных.</span></label><button class=\"button primary full\" type=\"submit\">Отправить запрос →</button></form><div class=\"success\" id=\"partsSuccess\"><h3>Запрос подготовлен</h3><p>В рабочей версии он будет передан специалисту по комплектующим.</p></div></div></div></section>\n  </main>\n  <footer class=\"footer\"><div class=\"container footer-grid\"><div><strong style=\"color:#fff\">ТТС Инжиниринг Казахстан</strong><p>Промышленное оборудование, автоматизация и сервис.</p></div><div><h4>Сервис</h4><a href=\"ТТС_инженерный_сервис.html\">Инженерный сервис</a><a href=\"ТТС_запасные_части_и_автоматика.html\">Запасные части</a><a href=\"#request\">Отправить запрос</a></div><div><h4>Оборудование</h4><a href=\"ТТС_общий_каталог_оборудования.html\">Весь каталог</a><a href=\"ТТС_прототип_лендинга_Казахстан.html\">Главная</a></div></div><div class=\"container footer-bottom\">© 2026 ТТС Инжиниринг Казахстан</div></footer>\n  <script>const partsForm=document.getElementById('partsForm');const partsSuccess=document.getElementById('partsSuccess');partsForm.addEventListener('submit',e=>{e.preventDefault();partsForm.style.display='none';partsSuccess.classList.add('visible')});<\/script>\n</body>\n</html>\n"};
    const initialPage="ТТС_прототип_лендинга_Казахстан.html";
    const frame=document.getElementById('site');
    let currentPage=initialPage;

    function parseRoute(raw){
      const parts=raw.split('#');
      let file=(parts[0]||currentPage).split('?')[0];
      if(file.startsWith('./'))file=file.slice(2);
      return {file,hash:parts[1]||''};
    }

    function attachRouter(hash){
      const doc=frame.contentDocument;
      if(!doc)return;
      document.title=doc.title||'ТТС Инжиниринг Казахстан';
      doc.addEventListener('click',event=>{
        const anchor=event.target.closest('a[href]');
        if(!anchor)return;
        const href=anchor.getAttribute('href');
        if(!href)return;
        if(href.startsWith('#')){
          const targetId=decodeURIComponent(href.slice(1));
          const target=doc.getElementById(targetId);
          if(target){
            event.preventDefault();
            target.scrollIntoView({behavior:'smooth',block:'start'});
          }
          return;
        }
        if(/^(https?:|mailto:|tel:|javascript:)/i.test(href))return;
        const route=parseRoute(href);
        if(!pages[route.file])return;
        event.preventDefault();
        openPage(route.file,route.hash,true);
      });
      if(hash){
        requestAnimationFrame(()=>{
          const target=doc.getElementById(decodeURIComponent(hash));
          if(target)target.scrollIntoView({block:'start'});
        });
      }
    }

    function openPage(file,hash='',push=false){
      if(!pages[file])file=initialPage;
      currentPage=file;
      frame.onload=()=>attachRouter(hash);
      frame.srcdoc=pages[file];
      if(push){
        const route='#!'+encodeURIComponent(file)+(hash?'::'+encodeURIComponent(hash):'');
        history.pushState({file,hash},'',route);
      }
    }

    function routeFromLocation(){
      const value=location.hash.startsWith('#!')?location.hash.slice(2):'';
      if(!value)return {file:initialPage,hash:''};
      const [file,hash='']=value.split('::');
      return {file:decodeURIComponent(file),hash:decodeURIComponent(hash)};
    }

    addEventListener('popstate',()=>{
      const route=routeFromLocation();
      openPage(route.file,route.hash,false);
    });
    const firstRoute=routeFromLocation();
    openPage(firstRoute.file,firstRoute.hash,false);
  </script>
