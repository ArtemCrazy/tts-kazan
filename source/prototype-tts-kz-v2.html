dia(max-width:860px){.service-dropdown{width:100%}}\n    @media(max-width:600px){.catalog-dropdown{grid-template-columns:1fr}.catalog-dropdown .all-catalog{grid-column:auto}.footer-catalog{align-items:flex-start;flex-direction:column}.footer-catalog .button{width:100%}.service-trust{grid-template-columns:1fr}.service-card{min-height:auto}.service-card h3{font-size:30px}.service-card-actions .button{width:100%}}\n  </style>\n<style data-monochrome-theme>\n    :root{--g950:#0b0b0b;--g900:#171717;--g800:#292929;--g700:#444;--cream:#e8e8e6;--cream2:#f5f5f3;--paper:#fff;--gold:#666;--gold2:#d0d0d0;--ink:#181818;--muted:#666;--line:#cececa;--shadow:0 24px 70px rgba(0,0,0,.14)}\n    html{filter:grayscale(1)}\n  </style></head>\n<body>\n  <div class=\"topline\"><div class=\"container topline-inner\"><span>Инжиниринг для строительной индустрии Казахстана с 2006 года</span><span>Поставка, монтаж и сервис по Казахстану</span></div></div>\n  <header class=\"site-header\"><div class=\"container header-inner\">\n    <a class=\"brand\" href=\"#top\"><span class=\"brand-mark\">ТТС</span><span><strong>ТТС Инжиниринг</strong><small>Казахстан</small></span></a>\n    <nav class=\"main-nav\" id=\"menu\"><a href=\"#catalog\">Оборудование</a><div class=\"nav-catalog\"><a class=\"catalog-trigger\" href=\"ТТС_общий_каталог_оборудования.html\" aria-haspopup=\"true\">Каталог</a><div class=\"catalog-dropdown\" aria-label=\"Разделы каталога\"><a href=\"ТТС_каталог_заводов_ЗССС.html\"><strong>Заводы сухих смесей</strong><span>SmartDryMix 5–50+ т/ч</span></a><a href=\"ТТС_каталог_бетонных_заводов.html\"><strong>Бетонные заводы</strong><span>Товарный бетон, ЖБИ и дороги</span></a><a href=\"ТТС_каталог_заводов_ВПИ.html\"><strong>Заводы ВПИ</strong><span>Готовые линии QUNFENG + ТТС</span></a><a href=\"ТТС_каталог_цементных_терминалов.html\"><strong>Цементные терминалы</strong><span>SmartStock 1000–5000 тонн</span></a><a href=\"ТТС_каталог_пневмокамерных_насосов.html\"><strong>Пневмокамерные насосы</strong><span>ПКН 10–60 т/ч, подача до 250 м</span></a><a class=\"all-catalog\" href=\"ТТС_общий_каталог_оборудования.html\"><strong>Весь каталог →</strong><span>23 позиции, поиск и фильтры</span></a></div></div><div class=\"nav-catalog nav-service\"><a class=\"catalog-trigger\" href=\"#service\" aria-haspopup=\"true\">Сервис</a><div class=\"catalog-dropdown service-dropdown\" aria-label=\"Сервис и запчасти\"><a href=\"ТТС_инженерный_сервис.html\"><strong>Инженерный сервис</strong><span>Диагностика, запуск и поддержка 24/7</span></a><a href=\"ТТС_запасные_части_и_автоматика.html\"><strong>Запасные части</strong><span>Подбор комплектующих и автоматики</span></a></div></div><a href=\"#company\">О компании</a><a href=\"#projects\">Проекты</a></nav>\n    <a class=\"header-cta\" href=\"#contact\">Получить расчёт</a><button class=\"menu-button\" id=\"menuButton\" type=\"button\" aria-label=\"Открыть меню\"><span></span><span></span><span></span></button>\n  </div></header>\n\n  <section class=\"hero\" id=\"top\"><div class=\"container hero-grid\">\n    <div><p class=\"eyebrow\">Инжиниринг полного цикла для строительной индустрии Казахстана с 2006 года</p><h1>Заводы сухих смесей, бетонные заводы и цементные терминалы - от проекта до запуска</h1><p class=\"hero-text\">Оборудование для производства сухих строительных смесей, товарного бетона, ЖБИ, ВПИ и строительства “под ключ”.</p>\n      <div class=\"button-row\"><a class=\"button primary\" href=\"ТТС_общий_каталог_оборудования.html\">Перейти в каталог →</a><a class=\"button outline\" href=\"#quiz\">Выбрать оборудование</a></div>\n      <div class=\"hero-benefits\"><span><i>✓</i> Собственное производство</span><span><i>✓</i> Оборудование в наличии</span><span><i>✓</i> Филиал в Алматы — проекты по Казахстану</span></div>\n    </div>\n    <div class=\"hero-visual\"><div class=\"hero-circle\"></div><div class=\"hero-photo\" aria-label=\"Место для фотографии промышленного завода\"></div><div class=\"availability\"><span></span> Проектирование и поставка под ключ</div></div>\n  </div></section>\n\n  <section class=\"quiz-section\" id=\"quiz\"><div class=\"container quiz-shell\"><div class=\"quiz-intro\"><p class=\"eyebrow light\">Подбор за 2 минуты</p><h2>Какой объект вы планируете?</h2><p>Ответьте на три вопроса — покажем базовую конфигурацию и подготовим исходные данные для инженера.</p></div>\n    <div class=\"quiz-fields\"><label>Тип объекта<select id=\"quizDirection\"><option value=\"zsss\">Завод сухих смесей</option><option value=\"beton\" selected>Бетонный завод</option><option value=\"terminal\">Цементный терминал</option></select></label><label>Производительность / хранение<select id=\"quizCapacity\" aria-live=\"polite\"></select></label><label>Стадия проекта<select id=\"quizStage\"><option>Формируем идею</option><option selected>Выбираем технологию</option><option>Есть площадка и ТЗ</option></select></label><button class=\"button gold\" id=\"quizButton\" type=\"button\">Показать решение →</button></div>\n    <div class=\"quiz-result\" id=\"quizResult\"><div><small>Предварительная рекомендация</small><strong id=\"resultTitle\"></strong><p id=\"resultText\"></p></div><div class=\"quiz-meta\"><span id=\"resultCapacity\"></span><span id=\"resultStage\"></span></div><a class=\"text-link light-link\" href=\"#contact\">Получить инженерный расчёт →</a></div>\n    <div class=\"quiz-matches\" id=\"quizMatches\" aria-live=\"polite\"><div class=\"quiz-matches-head\"><h3>Оборудование под выбранные параметры</h3><p>Первая карточка — основная рекомендация. Вторая, если доступна, показывает вариант с запасом производительности.</p></div><div class=\"quiz-cards\" id=\"quizCards\"></div></div>\n  </div></section>\n\n  <section class=\"section\" id=\"catalog\"><div class=\"container\"><div class=\"section-heading\"><div><p class=\"eyebrow\">Каталог оборудования</p><h2>Выберите направление</h2></div><p>На главной — только основные категории. Полный каталог с фильтрами и характеристиками находится на отдельных страницах.</p></div>\n    <div class=\"catalog-grid\">\n      <article class=\"catalog-card\" id=\"zsss\"><div class=\"card-image\" aria-label=\"Место для фотографии завода сухих смесей\"><span>01</span></div><div class=\"card-body\"><h3>Заводы сухих смесей</h3><p>SmartDryMix 5–50+ т/ч. Горизонтальные и башенные компоновки под продукт и сырьё заказчика.</p><a class=\"text-link\" href=\"ТТС_каталог_заводов_ЗССС.html\">Смотреть модели →</a></div></article>\n      <article class=\"catalog-card\" id=\"beton\"><div class=\"card-image\" aria-label=\"Место для фотографии бетонного завода\"><span>02</span></div><div class=\"card-body\"><h3>Бетонные заводы</h3><p>Решения для товарного бетона, ЖБИ, ВПИ, дорог и аэропортов производительностью 10–450 м³/ч.</p><a class=\"text-link\" href=\"ТТС_каталог_бетонных_заводов.html\">Смотреть модели →</a></div></article>\n      <article class=\"catalog-card\" id=\"terminal\"><div class=\"card-image\" aria-label=\"Место для фотографии цементного терминала\"><span>03</span></div><div class=\"card-body\"><h3>Цементные терминалы</h3><p>SmartStock 1000–5000 тонн с механической или пневматической подачей цемента.</p><a class=\"text-link\" href=\"ТТС_каталог_цементных_терминалов.html\">Смотреть модели →</a></div></article>\n    </div>\n  </div></section>\n\n  <section class=\"section vpi-feature\" id=\"vpi\"><div class=\"container split\"><div class=\"feature-image\" aria-label=\"Место для фотографии готовой линии ВПИ QUNFENG и ТТС\"><div class=\"image-note\">QUNFENG × ТТС · единая линия ВПИ</div></div><div class=\"feature-copy\"><p class=\"eyebrow\">QUNFENG + ТТС · готовые линии ВПИ</p><h2>Вибропрессование под ключ — от рецептуры до паллетирования</h2><p>ТТС проектирует БСУ, дозирование, автоматизацию и запуск. QUNFENG комплектует участок формования, пресс-формы и околопрессовое оборудование. Все узлы работают как единая технологическая линия.</p><ul class=\"check-list\"><li>Три основные связки: SmartBeton 30 S / 60 S / 90 S + вибропрессы QUNFENG</li><li>До 15–40 м³ бетона в час и до 30–66 изделий за цикл</li><li>Один подрядчик отвечает за интеграцию, запуск и поддержку 24/7</li></ul><a class=\"button primary\" href=\"ТТС_каталог_заводов_ВПИ.html\">Смотреть линии QUNFENG + ТТС →</a></div></div></section>\n\n  <section class=\"section feature\" id=\"lines\"><div class=\"container split\"><div class=\"feature-image\" aria-label=\"Место для фотографии бетонного завода\"><div class=\"image-note\">SmartBeton 60 / 90 / 120 / 135</div></div><div class=\"feature-copy\"><p class=\"eyebrow\">Бетонные заводы</p><h2>Бетонные заводы под ключ — от проекта до запуска</h2><p>Проектируем и комплектуем бетонные заводы под требуемый продукт, производительность, логистику и условия площадки.</p><ul class=\"check-list\"><li>Производительность от 10 до 450 м³/ч</li><li>Решения для товарного бетона, ЖБИ, ВПИ, дорог и аэропортов</li><li>Собственная АСУ SmartMix, монтаж и пусконаладка</li></ul><a class=\"button primary\" href=\"ТТС_каталог_бетонных_заводов.html\">Подобрать бетонный завод →</a></div></div></section>\n\n  <section class=\"section company\" id=\"company\"><div class=\"container company-grid\"><div class=\"company-copy\"><p class=\"eyebrow light\">О компании</p><h2>Инженерная экспертиза, производство и локальная поддержка</h2><p>ТТС Инжиниринг объединяет проектирование, собственное производство оборудования и автоматизации, поставку и сопровождение промышленных объектов.</p><p>Филиал в Алматы помогает учитывать требования площадки, логистику и особенности реализации проектов в Казахстане.</p><a class=\"text-link light-link\" href=\"#projects\">Посмотреть проекты →</a></div><div class=\"stats\"><div><strong>20+</strong><span>лет на рынке промышленного оборудования</span></div><div><strong>1 000+</strong><span>реализованных проектов по странам СНГ</span></div><div><strong class=\"stat-text\">Собственная АСУ ТП</strong><span>Разработка, внедрение и сопровождение</span></div><div><strong class=\"stat-text\">Техподдержка 24/7</strong><span>Оперативная помощь в любое время</span></div></div></div></section>\n\n  <section class=\"section service-showcase\" id=\"service\"><div class=\"container\"><div class=\"section-heading\"><div><p class=\"eyebrow\">Сервис и комплектующие</p><h2>Поддерживаем производство после запуска</h2></div><p>Инженеры ТТС сопровождают оборудование, автоматику и технологический процесс — от первого запуска до планового обслуживания и срочной помощи.</p></div><div class=\"service-trust\"><div><strong>24/7</strong><span>техническая поддержка</span></div><div><strong>На площадке</strong><span>шеф-монтаж, пусконаладка и обучение</span></div><div><strong>Единый контур</strong><span>оборудование, собственная АСУ и комплектующие</span></div></div><div class=\"service-grid\"><article class=\"service-card\"><div class=\"service-card-top\"><span class=\"service-card-number\">01</span><span class=\"service-card-tag\">Минимум простоев</span></div><h3>Инженерный сервис</h3><p>Сопровождаем промышленное оборудование на всём сроке эксплуатации и рассматриваем неисправность в контексте всей технологической линии.</p><ul class=\"service-points\"><li>Технический аудит и диагностика</li><li>Шеф-монтаж, подключение и пусконаладка</li><li>Калибровка, пробный выпуск и обучение персонала</li><li>Регламентное обслуживание и срочная техпомощь</li></ul><div class=\"service-card-actions\"><a class=\"button primary\" href=\"ТТС_инженерный_сервис.html\">Подробнее о сервисе →</a><a class=\"text-link service-request\" href=\"#contact\" data-service=\"Инженерный сервис\">Оставить заявку</a></div></article><article class=\"service-card\"><div class=\"service-card-top\"><span class=\"service-card-number\">02</span><span class=\"service-card-tag\">Совместимость узлов</span></div><h3>Запасные части и автоматика</h3><p>Подбираем комплектующие по модели, спецификации, маркировке или фотографии и проверяем совместимость до поставки.</p><ul class=\"service-points\"><li>Узлы смесителей, шнеки, затворы и приводы</li><li>Датчики, пневматика и электрокомпоненты</li><li>Шкафы управления и элементы собственной АСУ</li><li>Подбор, поставка, монтаж и проверка работы</li></ul><div class=\"service-card-actions\"><a class=\"button outline\" href=\"ТТС_запасные_части_и_автоматика.html\">Перейти к запчастям →</a><a class=\"text-link service-request\" href=\"#contact\" data-service=\"Запасные части и автоматика\">Отправить запрос</a></div></article></div></div></section>\n\n  <section class=\"section pkn\" id=\"pkn\"><div class=\"container pkn-grid\"><div class=\"pkn-image\" aria-label=\"Место для фотографии пневмокамерного насоса\"><span>Дополнительное оборудование</span></div><div class=\"pkn-copy\"><p class=\"eyebrow\">Пневмотранспорт</p><h2>Пневмокамерные насосы</h2><p>Для подачи цемента и других сухих сыпучих материалов на терминалах, бетонных заводах и предприятиях ЖБИ.</p><div class=\"specs\"><div><strong>10–60</strong><span>т/ч</span></div><div><strong>до 250</strong><span>м по горизонтали</span></div><div><strong>до 30</strong><span>м по вертикали</span></div></div><p>Поставляются в собранном виде, в комплект поставки входит шкаф управления.</p><a class=\"button outline\" href=\"ТТС_каталог_пневмокамерных_насосов.html\">Подобрать ПКН</a></div></div></section>\n\n  <section class=\"section\" id=\"projects\"><div class=\"container\"><div class=\"section-heading\"><div><p class=\"eyebrow\">Проекты в Казахстане</p><h2>Решения под продукт, площадку и задачу</h2></div><a class=\"text-link\" href=\"#contact\">Обсудить похожий проект →</a></div><div class=\"projects\"><article><span>Бетонный завод · Актобе</span><h3>Производство стеновых панелей</h3><p>Компоновка завода под серийный выпуск ЖБИ и интеграцию в действующую площадку.</p></article><article><span>Бетонный завод · Астана</span><h3>Объёмные блоки</h3><p>Автоматизированный комплекс для запуска нового производственного направления.</p></article><article><span>БСУ + терминал · Алматы</span><h3>Единая производственная площадка</h3><p>Синхронизация бетонного производства и узла приёма, хранения и подачи цемента.</p></article></div></div></section>\n\n  <section class=\"section faq\"><div class=\"container faq-grid\"><div><p class=\"eyebrow\">Частые вопросы</p><h2>Подбор начинается с вашей задачи</h2></div><div class=\"faq-list\"><details open><summary>Какие данные нужны для первого расчёта?</summary><p>Тип продукта, требуемая производительность, доступное сырьё, данные площадки, логистика и плановый срок запуска.</p></details><details><summary>Можно ли заказать завод и цементный терминал одним проектом?</summary><p>Да. Мы можем разработать связанную концепцию производства, хранения, подачи материалов и общей автоматизации.</p></details><details><summary>Выполняете ли вы модернизацию действующего объекта?</summary><p>Да, после технического аудита и определения точек интеграции нового оборудования и АСУ.</p></details><details><summary>Как выбрать между механической и пневматической подачей?</summary><p>Выбор зависит от схемы разгрузки, требуемой производительности, расстояний, площадки и эксплуатационных затрат.</p></details></div></div></section>\n\n  <section class=\"contact\" id=\"contact\"><div class=\"container contact-grid\"><div class=\"contact-copy\"><p class=\"eyebrow light\">Обсудим проект</p><h2>Получите расчёт оборудования под вашу задачу</h2><p>Инженер уточнит продукт, производительность и исходные данные площадки, затем предложит состав оборудования и следующий этап проекта.</p><div class=\"contact-details\"><strong>Филиал ТТС Инжиниринг в Казахстане</strong><span>Алматы, ул. Казыбек Би, 22, офис 302</span><span>Пн–Пт, 9:00–18:00</span></div></div><div class=\"form-card\"><form id=\"leadForm\"><h3>Оставьте контакты</h3><p>Перезвоним в рабочее время и уточним задачу.</p><label>Направление<select id=\"leadDirection\"><option value=\"zsss\">Заводы сухих смесей</option><option value=\"beton\" selected>Бетонные заводы</option><option value=\"vpi\">Заводы ВПИ</opti ый склад с запасом по вместимости.',page:'ТТС_каталог_цементных_терминалов.html'}],\n        '3000':[{code:'3000',name:'SmartStock 3000',capacity:'3000 тонн',description:'Промышленный склад с несколькими марками цемента.',page:'ТТС_каталог_цементных_терминалов.html'},{code:'5000',name:'SmartStock 5000',capacity:'5000 тонн',description:'Крупный распределительный комплекс с запасом вместимости.',page:'ТТС_каталог_цементных_терминалов.html'}],\n        '5000':[{code:'5000',name:'SmartStock 5000',capacity:'5000 тонн',description:'Крупный комплекс для масштабной логистики цемента.',page:'ТТС_каталог_цементных_терминалов.html'}]\n      }\n    };\n    const quizDirection=document.getElementById('quizDirection');const quizCapacity=document.getElementById('quizCapacity');const leadDirection=document.getElementById('leadDirection');const quizResult=document.getElementById('quizResult');const quizMatches=document.getElementById('quizMatches');const quizCards=document.getElementById('quizCards');\n    function hideQuizOutput(){quizResult.classList.remove('visible');quizMatches.classList.remove('visible');quizCards.replaceChildren()}\n    function updateCapacityOptions(){quizCapacity.replaceChildren(...capacityOptions[quizDirection.value].map(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;return option}));hideQuizOutput();leadDirection.value=quizDirection.value}\n    function quizCardTemplate(item,index,direction){return `<article class=\"quiz-card${index?' alt':''}\"><div class=\"quiz-card-media\" aria-label=\"Место для фотографии ${item.name}\"><span class=\"quiz-card-badge\">${index?'С запасом производительности':'Основная рекомендация'}</span><span class=\"quiz-card-code\">${item.code}</span></div><div class=\"quiz-card-body\"><div class=\"quiz-card-category\">Позиция из каталога</div><h4>${item.name}</h4><p class=\"quiz-card-description\">${item.description}</p><div class=\"quiz-card-capacity\"><span>Производительность / вместимость</span><strong>${item.capacity}</strong></div><div class=\"quiz-card-actions\"><a class=\"button outline\" href=\"${item.page}\">Подробнее →</a><a class=\"button primary quiz-quote\" href=\"#contact\" data-direction=\"${direction}\" data-model=\"${item.name}\">Получить КП</a></div></div></article>`}\n    function renderQuizCards(direction,capacity){const items=quizCatalog[direction][capacity]||[];quizCards.innerHTML=items.map((item,index)=>quizCardTemplate(item,index,direction)).join('');quizMatches.classList.toggle('visible',items.length>0)}\n    const entry=new URLSearchParams(location.search).get('direction');if(['zsss','beton','terminal'].includes(entry)){quizDirection.value=entry;leadDirection.value=entry}updateCapacityOptions();quizDirection.addEventListener('change',updateCapacityOptions);quizCapacity.addEventListener('change',hideQuizOutput);document.getElementById('quizStage').addEventListener('change',hideQuizOutput);\n    document.getElementById('quizButton').addEventListener('click',()=>{const value=quizDirection.value;const capacity=quizCapacity.value;const recommendation=rec[value][capacity];document.getElementById('resultTitle').textContent=recommendation.title;document.getElementById('resultText').textContent=recommendation.text;document.getElementById('resultCapacity').textContent='Параметр: '+quizCapacity.options[quizCapacity.selectedIndex].text;document.getElementById('resultStage').textContent='Стадия: '+document.getElementById('quizStage').value;quizResult.classList.add('visible');renderQuizCards(value,capacity);leadDirection.value=value});\n    quizCards.addEventListener('click',event=>{const quote=event.target.closest('.quiz-quote');if(quote)leadDirection.value=quote.dataset.direction});\n    document.querySelectorAll('[data-direction]').forEach(a=>a.addEventListener('click',()=>leadDirection.value=a.dataset.direction));\n    document.querySelectorAll('[data-service]').forEach(a=>a.addEventListener('click',()=>leadDirection.value=a.dataset.service==='Инженерный сервис'?'service':'parts'));\n    const form=document.getElementById('leadForm');const success=document.getElementById('success');form.addEventListener('submit',e=>{e.preventDefault();form.style.display='none';success.classList.add('visible')});document.getElementById('again').addEventListener('click',()=>{success.classList.remove('visible');form.style.display='block';form.reset()});\n    document.querySelectorAll('[data-cookie-close]').forEach(b=>b.addEventListener('click',()=>document.getElementById('cookie').remove()));\n  <\/script>\n</body>\n</html>\n","ТТС_общий_каталог_оборудования.html":"<!doctype html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <title>Каталог оборудования ТТС Инжиниринг — Казахстан</title>\n  <meta name=\"description\" content=\"Каталог заводов сухих смесей, бетонных заводов, заводов ВПИ, цементных терминалов и пневмокамерных насосов для проектов в Казахстане.\">\n  <style>\n    :root{--g950:#102f25;--g900:#173e30;--g800:#245744;--g700:#36755b;--cream:#f3eddf;--cream2:#faf7ef;--paper:#fffdf8;--gold:#bc8a3d;--gold2:#e8cc98;--ink:#203029;--muted:#68716c;--line:#d8d2c5;--shadow:0 24px 70px rgba(19,47,37,.14)}\n    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--cream2);font:16px/1.55 Arial,Helvetica,sans-serif}body.modal-open{overflow:hidden}button,input,select,textarea{font:inherit}button{color:inherit}a{color:inherit}h1,h2,h3,h4,p{margin-top:0}h1,h2{color:var(--g950);font-family:Georgia,\"Times New Roman\",serif;font-weight:400;letter-spacing:-.035em;line-height:.99}h1{max-width:980px;margin-bottom:24px;font-size:clamp(48px,6vw,82px)}h2{margin-bottom:22px;font-size:clamp(38px,4.4vw,60px)}h3{color:var(--g950);font-size:24px;line-height:1.16}.container{width:min(100% - 64px,1240px);margin-inline:auto}.topline{color:#fff;background:var(--g800);font-size:12px;letter-s x;display:flex;flex:1;flex-direction:column}.product-category{margin-bottom:10px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.product-body h2{margin-bottom:11px;font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700;letter-spacing:0;line-height:1.14}.product-description{min-height:88px;margin-bottom:20px;color:var(--muted);font-size:13px}.product-capacity{margin-top:auto;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.product-capacity span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em}.product-capacity strong{display:block;margin-top:2px;color:var(--g800);font-size:17px}.product-actions{margin-top:20px;display:grid;grid-template-columns:1fr 1.18fr;gap:9px}.product-actions .button{min-height:47px;padding:0 12px}.details-button{min-height:47px;padding:0 12px;color:var(--g950);background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:12px;font-weight:700}.details-button:hover{border-color:var(--gold)}.empty-state{padding:70px 25px;display:none;text-align:center;background:var(--paper);border:1px solid var(--line)}.empty-state.visible{display:block}.empty-state h2{font-size:42px}.empty-state p{color:var(--muted)}.contact{padding:105px 0;color:#fff;background:var(--g800)}.contact-grid{display:grid;grid-template-columns:1fr .9fr;gap:80px;align-items:center}.contact h2{color:#fff}.contact-copy>p:not(.eyebrow){color:rgba(255,255,255,.72);font-size:18px}.contact-details{margin-top:38px;display:grid;gap:6px;color:rgba(255,255,255,.7)}.contact-details strong{color:#fff}.form-card{min-height:580px;padding:40px;color:var(--ink);background:var(--paper);box-shadow:var(--shadow)}.form-card h3{margin-bottom:8px;font:31px Georgia,serif}.form-card>form>p{color:var(--muted);font-size:13px}.form-card label{margin-top:15px;display:grid;gap:7px;font-size:12px}.form-card input,.form-card textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:3px;outline:none;background:#fff}.form-card textarea{min-height:82px;resize:vertical}.consent{grid-template-columns:20px 1fr!important;align-items:start}.consent input{width:18px;height:18px;margin-top:2px}.full{width:100%;margin-top:20px}.success{min-height:490px;display:none;place-items:center;align-content:center;text-align:center}.success.visible{display:grid}.success>span{width:70px;height:70px;display:grid;place-items:center;color:#fff;background:var(--g700);border-radius:50%;font-size:30px}.success h3{margin:20px 0 8px}.success p{max-width:390px;color:var(--muted)}.footer{padding:58px 0 25px;color:rgba(255,255,255,.66);background:#0c251d}.footer-grid{display:grid;grid-template-columns:1.3fr .9fr .9fr;gap:60px}.footer h4{margin-bottom:18px;color:#fff;font-size:14px}.footer a,.footer span{margin-bottom:8px;display:block;text-decoration:none;font-size:12px}.footer-brand{color:#fff;font-weight:700}.footer-bottom{margin-top:42px;padding-top:21px;display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.13);font-size:11px}.modal{position:fixed;z-index:100;inset:0;padding:28px;display:none;place-items:center;background:rgba(8,30,23,.72)}.modal.open{display:grid}.modal-panel{position:relative;width:min(920px,100%);max-height:calc(100vh - 56px);overflow:auto;display:grid;grid-template-columns:.78fr 1.22fr;background:var(--paper);box-shadow:0 28px 90px rgba(0,0,0,.28)}.modal-placeholder{min-height:580px;background:var(--cream);border-right:1px solid var(--line)}.modal-content{padding:48px}.modal-close{position:absolute;z-index:2;right:16px;top:16px;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;cursor:pointer;background:var(--paper);font-size:21px}.modal-content h2{font-size:48px}.modal-capacity{margin:24px 0;padding:17px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.modal-capacity span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.modal-capacity strong{color:var(--g800);font-size:19px}.modal-description{color:var(--muted)}.modal-content h3{margin:28px 0 12px;font-size:18px}.modal-features{margin:0 0 30px;padding:0;list-style:none}.modal-features li{padding:11px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px}.modal-features li:before{content:\"✓\";margin-right:11px;color:var(--g700);font-weight:700}.modal-actions{display:flex;gap:10px;flex-wrap:wrap}\n    @media(max-width:980px){.catalog-grid{grid-template-columns:repeat(2,1fr)}.contact-grid{grid-template-columns:1fr}.nav{display:none}.modal-panel{grid-template-columns:1fr}.modal-placeholder{min-height:270px;border-right:0;border-bottom:1px solid var(--line)}}\n    @media(max-width:680px){.container{width:min(100% - 30px,1240px)}.topline-inner span:last-child{display:none}.header-inner{min-height:82px}.brand-mark{width:46px;height:46px}.header .button{display:none}.catalog-hero{padding-top:38px}h1{font-size:43px}.catalog-note{align-items:flex-start;flex-direction:column}.filters,.catalog-grid{grid-template-columns:1fr}.product-description{min-height:0}.contact{padding:76px 0}.contact-grid{gap:42px}.form-card{padding:28px 22px}.footer-grid{grid-template-columns:1fr;gap:35px}.footer-bottom{align-items:flex-start;flex-direction:column}.modal{padding:12px}.modal-panel{max-height:calc(100vh - 24px)}.modal-content{padding:35px 22px}.modal-content h2{font-size:38px}.modal-actions,.modal-actions .button{width:100%}}\n  </style>\n<style data-monochrome-theme>\n    :root{--g950:#0b0b0b;--g900:#171717;--g800:#292929;--g700:#444;--cream:#e8e8e6;--cream2:#f5f5f3;--paper:#fff;--gold:#666;--gold2:#d0d0d0;--ink:#181818;--muted:#666;--line:#cececa;--shadow:0 24px 70px rgba(0,0,0,.14)}\n    html{filter:grayscale(1)}\n  </style></head>\n<body>\n  <div class=\"topline\"><div class=\"container topline-inner\"><span>Инжиниринг для строительной индустрии Казахстана с 2006 года</span><span>Поставка · монтаж · запуск · сервис</span></div></div>\n  <header class=\"header\"><div class=\"container header-inner\"><a class=\"brand\" href=\"ТТС_прототип_лендинга_Казахстан.html\"><span class=\"brand-mark\">ТТС</span><span><strong>ТТС Инжиниринг</strong><small>Казахстан</small></span></a><nav class=\"nav\"><a href=\"#catalog\">Оборудование</a><a href=\"#contact\">Подбор инженером</a><a href=\"ТТС_прототип_лендинга_Казахстан.html#service\">Сервис</a><a href=\"ТТС_прототип_лендинга_Казахстан.html#company\">О компании</a></nav><a class=\"button primary\" href=\"#contact\">Получить расчёт</a></div></header>\n\n  <main>\n    <div class=\"container breadcrumb\"><a href=\"ТТС_прототип_лендинга_Казахстан.html\">Главная</a> &nbsp;/&nbsp; Каталог оборудования</div>\n    <section class=\"catalog-hero\"><div class=\"container\"><p class=\"eyebrow\">Каталог промышленного оборудования</p><h1>Оборудование для строительной индустрии Казахстана</h1><p>Заводы сухих строительных смесей, бетонные заводы, линии ВПИ, цементные терминалы и пневмокамерные насосы — с проектированием, автоматизацией и запуском.</p><div class=\"catalog-note\"><strong>Подберите базовую конфигурацию по направлению, назначению и масштабу</strong><span>Финальный состав оборудования подтверждает инженер после анализа продукта, сырья, логистики и площадки.</span></div></div></section>\n\n    <section class=\"catalog-main\" id=\"catalog\"><div class=\"container\">\n      <div class=\"category-tabs\" role=\"group\" aria-label=\"Категории оборудования\">\n        <button class=\"category-tab\" type=\"button\" data-category=\"all\" aria-pressed=\"true\">Всё оборудование</button>\n        <button class=\"category-tab\" type=\"button\" data-category=\"zsss\" aria-pressed=\"false\">Заводы сухих смесей</button>\n        <button class=\"category-tab\" type=\"button\" data-category=\"beton\" aria-pressed=\"false\">Бетонные заводы</button>\n        <button class=\"category-tab\" type=\"button\" data-category=\"vpi\" aria-pressed=\"false\">Заводы ВПИ</button>\n        <button class=\"category-tab\" type=\"button\" data-category=\"terminal\" aria-pressed=\"false\">Цементные терминалы</button>\n        <button class=\"category-tab\" type=\"button\" data-category=\"pkn\" aria-pressed=\"false\">ПКН</button>\n      </div>\n      <div class=\"filters\"><label>Поиск<input id=\"catalogSearch\" type=\"search\" placeholder=\"Модель, направление или производительность\"></label><label>Назначение<select id=\"purposeFilter\"><option value=\"all\">Любое</option><option value=\"drymix\">Сухие строительные смеси</option><option value=\"ready\">Товарный бетон и дороги</option><option value=\"vpi\">Вибропрессованные изделия</option><option value=\"storage\">Хранение цемента</option><option value=\"transport\">Пневмотранспорт</option></select></label><label>Масштаб<select id=\"scaleFilter\"><option value=\"all\">Любой</option><option value=\"compact\">Компактный</option><option value=\"medium\">Средний</option><option value=\"industrial\">Промышленный</option></select></label></div>\n      <div class=\"result-row\"><div class=\"result-count\" id=\"resultCount\" aria-live=\"polite\">Найдено позиций: 23</div><button class=\"reset\" id=\"resetFilters\" type=\"button\">Сбросить фильтры</button></div>\n      <div class=\"catalog-grid\" id=\"catalogGrid\"></div>\n      <div class=\"empty-state\" id=\"emptyState\"><h2>Ничего не найдено</h2><p>Измените запрос или сбросьте фильтры — инженер также может подобрать нестандартную конфигурацию.</p><button class=\"button outline\" id=\"emptyReset\" type=\"button\">Показать всё оборудование</button></div>\n    </div></section>\n\n    <section class=\"contact\" id=\"contact\"><div class=\"container contact-grid\"><div class=\"contact-copy\"><p class=\"eyebrow\" style=\"color:var(--gold2)\">Обсудим проект</p><h2>Не нашли точную конфигурацию? Подберём оборудование</h2><p>Инженер уточнит продукт, производительность, исходные данные площадки и логистику, затем предложит состав оборудования и подготовит коммерческое предложение.</p><div class=\"contact-details\"><strong>Филиал ТТС Инжиниринг в Казахстане</strong><span>Алматы, ул. Казыбек Би, 22, офис 302</span><span>Техническая поддержка собственной АСУ — 24/7</span></div></div><div class=\"form-card\"><form id=\"catalogForm\"><h3>Оставьте контакты</h3><p>Перезвоним в рабочее время и уточним задачу.</p><label>Выбранное оборудование<input id=\"selectedEquipment\" name=\"equipment\" value=\"Подобрать по задаче\"></label><label>Ваше имя<input required name=\"name\" placeholder=\"Имя Фамилия\"></label><label>Телефон для связи<input required name=\"phone\" placeholder=\"+7 (___) ___-__-__\"></label><label>Комментарий<textarea name=\"comment\" placeholder=\"Продукт, производительность и условия площадки\"></textarea></label><label class=\"consent\"><input type=\"checkbox\" required><span>Я согласен на обработку персональных данных.</span></label><button class=\"button gold full\" type=\"submit\">Получить консультацию →</button></form><div class=\"success\" id=\"success\"><span>✓</span><h3>Заявка подготовлена</h3><p>В рабочей версии выбранная позиция и контакты будут переданы профильному инженеру вместе с рекламным источником.</p><button class=\"button outline\" id=\"again\" type=\"button\">Выбрать другое оборудование</button></div></div></div></section>\n  </main>\n\n  <footer class=\"footer\"><div class=\"container\"><div class=\"footer-grid\"><div><div class=\"footer-brand\">ТТС Инжиниринг Казахстан</div><p>Заводы, терминалы и технологическое оборудование для строительной индустрии.</p></div><div><h4>Каталоги</h4><a href=\"ТТС_каталог_заводов_ЗССС.html\">Заводы сухих смесей</a><a href=\"ТТС_каталог_бетонных_заводов.html\">Бетонные заводы</a><a href=\"ТТС_каталог_заводов_ВПИ.html\">Заводы ВПИ</a></div><div><h4>Оборудование</h4><a href=\"ТТС_каталог_цементных_терминалов.html\">Цементные терминалы</a><a href=\"ТТС_каталог_пневмокамерных_насосов.html\">Пневмокамерные насосы</a><a href=\"ТТС_прототип_лендинга_Казахстан.h ктеристики и описание</button></div></div></article>`}\n    function getFiltered(){const query=normalize(search.value.trim());return catalogData.filter(item=>(activeCategory==='all'||item.category===activeCategory)&&(purpose.value==='all'||item.purpose===purpose.value)&&(scale.value==='all'||item.scale===scale.value)&&(!query||normalize([item.name,item.categoryLabel,item.capacity,item.description,...item.features].join(' ')).includes(query)))}\n    function render(){const items=getFiltered();grid.innerHTML=items.map(cardTemplate).join('');count.textContent=`Найдено позиций: ${items.length}`;empty.classList.toggle('visible',items.length===0);grid.style.display=items.length?'grid':'none'}\n    function resetFilters(){activeCategory='all';search.value='';purpose.value='all';scale.value='all';document.querySelectorAll('.category-tab').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.category==='all')));render()}\n    function findItem(id){return catalogData.find(item=>item.id===id)}\n    function requestQuote(item){selected.value=item?item.name:'Подобрать по задаче';closeModal();document.getElementById('contact').scrollIntoView({behavior:'smooth'})}\n    function openModal(item){activeProduct=item;document.getElementById('modalCategory').textContent=item.categoryLabel;document.getElementById('modalTitle').textContent=item.name;document.getElementById('modalCapacity').textContent=item.capacity;document.getElementById('modalDescription').textContent=item.description;document.getElementById('modalFeatures').innerHTML=item.features.map(feature=>`<li>${feature}</li>`).join('');document.getElementById('modalPage').href=item.page;modal.classList.add('open');modal.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');document.getElementById('modalClose').focus()}\n    function closeModal(){modal.classList.remove('open');modal.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open')}\n    document.querySelect sp; Каталог оборудования &nbsp;/&nbsp; Заводы сухих смесей</div>\n\n    <section class=\"hero\"><div class=\"container hero-grid\"><div class=\"hero-copy\"><p class=\"eyebrow\">Модульные заводы для Казахстана</p><h1>Заводы сухих строительных смесей SmartDryMix</h1><p>Вместо набора фиксированных моделей — модульная система конфигурации. Каждый завод собирается индивидуально под продукт, сырьё и площадку заказчика.</p><div class=\"hero-buttons\"><a class=\"button primary\" href=\"#builder\">Собрать конфигурацию →</a><a class=\"button outline\" href=\"#contact\">Получить инженерный расчёт</a></div></div><div class=\"hero-frame\"><div class=\"hero-placeholder\" aria-label=\"Место для фотографии завода сухих смесей\"></div><div class=\"hero-note\">От приёмки сырья до паллетизации</div></div></div></section>\n\n    <div class=\"container metrics\"><div><strong>5–50+</strong><span>тонн готовой смеси в час</span></div><div><strong>G / C / GC</strong><span>гипсовые, цементные и комбинированные</span></div><div><strong>T / L</strong><span>башенная или горизонтальная компоновка</span></div><div><strong>24/7</strong><span>техническая поддержка АСУ ТП</span></div></div>\n\n    <section class=\"section\" id=\"builder\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Логика линейки</p><h2>Расшифруйте конфигурацию SmartDryMix</h2><p>Обозначение показывает производительность, тип выпускаемых смесей и пространственную компоновку. Итоговый состав оборудования уточняется по рецептурам и исходным данным площадки.</p></div><div class=\"code-builder\"><article class=\"code-card\"><span>01</span><h3>Производительность</h3><p>Номинальная производительность линии по выпуску готовой сухой смеси.</p><div class=\"code-options\"><b>5 т/ч</b><b>20 т/ч</b><b>50+ т/ч</b></div></article><article class=\"code-card\"><span>02</span><h3>Тип смеси</h3><p>Сырьевая база и продуктовая программа определяют состав дозирования, смешивания и хранения.</p><div class=\"code-options\"><b>G — гипсовые</b><b>C — цементно-песчаные</b><b>GC — комбинированные</b></div></article><article class=\"code-card\"><span>03</span><h3>Компоновка</h3><p>Выбирается с учётом площади, высотных ограничений, логистики сырья и развития производства.</p><div class=\"code-options\"><b>T — башенная</b><b>L — горизонтальная</b></div></article><article class=\"code-card\"><span>04</span><h3>Индивидуальный состав</h3><p>Сушка, сортировка, хранение, дозаторы, смеситель, фасовка и паллетизация подбираются под задачу.</p><div class=\"code-options\"><b>продукт</b><b>сырьё</b><b>площадка</b></div></article></div></div></section>\n\n    <section class=\"section configurations\" id=\"examples\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Примеры линейки</p><h2>Три ориентира для предварительного выбора</h2><p>Это примеры конфигураций, а не ограниченный перечень моделей. Завод может быть адаптирован по производительности, рецептурам и составу участков.</p></div><div class=\"config-grid\"><article class=\"config-card\"><div class=\"config-photo\" aria-label=\"Место для фотографии SmartDryMix 5 G-L\"><span>5 G-L</span><b>Компактный</b></div><div class=\"config-body\"><h3>SmartDryMix 5 G-L</h3><p>Компактный гипсовый завод горизонтальной компоновки для старта или развития локального производства.</p><div class=\"config-specs\"><div><strong>5 т/ч</strong><span>производительность</span></div><div><strong>G · L</strong><span>гипс · горизонтальная</span></div></div><a class=\"button outline config-request\" href=\"#contact\" data-config=\"SmartDryMix 5 G-L\">Обсудить конфигурацию →</a></div></article><article class=\"config-card\"><div class=\"config-photo\" aria-label=\"Место для фотографии SmartDryMix 20 C-L\"><span>20 C-L</span><b>Средний масштаб</b></div><div class=\"config-body\"><h3>SmartDryMix 20 C-L</h3><p>Горизонтальный цементно-песчаный завод среднего масштаба с гибким составом хранения и фасовки.</p><div class=\"config-specs\"><div><strong>20 т/ч</strong><span>производительность</span></div><div><strong>C · L</strong><span>цемент · горизонтальная</span></div></div><a class=\"button outline config-request\" href=\"#contact\" data-config=\"SmartDryMix 20 C-L\">Обсудить конфигурацию →</a></div></article><article class=\"config-card\"><div class=\"config-photo\" aria-label=\"Место для фотографии SmartDryMix 50 GC-T\"><span>50 GC-T</span><b>Крупная линия</b></div><div class=\"config-body\"><h3>SmartDryMix 50 GC-T</h3><p>Крупная универсальная башенная линия для гипсовых и цементно-песчаных смесей с широкой номенклатурой продукции.</p><div class=\"config-specs\"><div><strong>50 т/ч</strong><span>производительность</span></div><div><strong>GC · T</strong><span>комбинированная · башенная</span></div></div><a class=\"button primary config-request\" href=\"#contact\" data-config=\"SmartDryMix 50 GC-T\">Обсудить конфигурацию →</a></div></article></div></div></section>\n\n    <section class=\"section process\" id=\"process\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Как устроено производство</p><h2>Четыре последовательных этапа</h2><p>Все участки проектируются как единая технологическая линия — от входного сырья до маркированной продукции на паллете.</p></div><div class=\"process-grid\"><article class=\"process-card\"><span>01</span><h3>Подготовка сырья</h3><p>Приёмный бункер с решёткой, транспортёр, сушка и сортировка обеспечивают чистоту фракций и стабильные характеристики сырья на входе.</p></article><article class=\"process-card\"><span>02</span><h3>Дозирование и перемешивание</h3><p>Дозаторы сухих, жидких и сверхлёгких компонентов. Одновальный, двухвальный или интенсивный смеситель — по требованиям к однородности рецептуры.</p></article><article class=\"process-card\"><span>03</span><h3>Управление производством</h3><p>АСУ SmartDryMix объединяет узлы завода в единый контур: от приёмки сырья и рецептурного дозирования до фасовки готовой продукции.</p></article><article class=\"process-card\"><span>04</span><h3>Выход продукции</h3><p>Фасовка, маркировка с датой, номером серии, штрихкодом или QR-кодом, последующая упаковка и паллетизация.</p></article></div></div></section>\n\n    <section class=\"section\" id=\"asu\"><div class=\"container asu-grid\"><div class=\"asu-result\"><small>АСУ ТП собственной разработки</small><h2 style=\"color:#fff\">SmartDryMix управляет всей линией</h2><div class=\"effect\"><div><strong>+30%</strong><span>производительность завода</span></div><div><strong>−20%</strong><span>издержки производства</span></div></div><p style=\"margin:28px 0 0;color:rgba(255,255,255,.68);font-size:12px\">Заявленные показатели зависят от исходного состояния производства, состава линии и режима эксплуатации.</p></div><div><p class=\"eyebrow\">Автоматизация</p><h2>Один контур управления и учёта</h2><ul class=\"asu-list\"><li><strong>Управление линией</strong><span>Дозирование, смешивание и фасовка работают в едином производственном контуре.</span></li><li><strong>Учёт и интеграция</strong><span>Расчёт остатков сырья и обмен данными с 1С и ERP-системами заказчика.</span></li><li><strong>Обучение операторов</strong><span>Режим «Тренажёр» позволяет отрабатывать действия без остановки производства.</span></li><li><strong>Техническая поддержка 24/7</strong><span>Сопровождение собственной АСУ ТП специалистами разработчика.</span></li></ul></div></div></section>\n\n    <section class=\"section scope\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Состав проекта</p><h2>Комплектация под ваш продукт и площадку</h2><p>Проект может включать все основные участки производства или интеграцию отдельных модулей в существующую инфраструктуру.</p></div><div class=\"scope-grid\"><article class=\"scope-card\"><span>01</span><h3>Хранение и транспорт</h3><p>Приёмные бункеры, силосы, конвейеры, элеваторы и пневмотранспорт.</p></article><article class=\"scope-card\"><span>02</span><h3>Сушка и сортировка</h3><p>Подготовка песка и разделение фракций под стабильные рецептуры.</p></article><article class=\"scope-card\"><span>03</span><h3>Дозирование</h3><p>Сухие компоненты, жидкости, добавки и сверхлёгкие материалы.</p></article><article class=\"scope-card\"><span>04</span><h3>Смешивание</h3><p>Выбор типа смесителя по рецептуре и требуемой однородности.</p></article><article class=\"scope-card\"><span>05</span><h3>Фасовка и паллетизация</h3><p>Маркировка, упаковка мешков и подготовка продукции к отгрузке.</p></article><article class=\"scope-card\"><span>06</span><h3>АСУ и поддержка</h3><p>SmartDryMix, интеграция учёта, обучение и техподдержка 24/7.</p></article></div></div></section>\n\n    <section class=\"contact\" id=\"contact\"><div class=\"container contact-grid\"><div class=\"contact-copy\"><p class=\"eyebrow\">Обсудим проект</p><h2>Получите конфигурацию SmartDryMix</h2><p>Инженер уточнит виды смесей, производительность, сырьё, требуемую фасовку и данные площадки, затем подготовит состав линии для проекта в Казахстане.</p><div class=\"contact-details\"><strong>Филиал ТТС Инжиниринг в Казахстане</strong><span>Алматы, ул. Казыбек Би, 22, офис 302</span><span>Техническая поддержка АСУ ТП — 24/7</span></div></div><div class=\"form-card\"><form id=\"zsssForm\"><h3>Оставьте исходные данные</h3><p>Это прототип формы. В рабочей версии заявка будет передаваться инженеру.</p><label>Конфигурация<input id=\"configField\" name=\"configuration\" value=\"Подобрать индивидуально\"></label><label>Тип смеси<select name=\"mix\"><option>Гипсовые смеси</option><option>Цементно-песчаные смеси</option><option>Гипсовые и цементно-песчаные</option><option>Требуется консультация</option></select></label><label>Ваше имя<input required name=\"name\" placeholder=\"Имя Фамилия\"></label><label>Телефон для связи<input required name=\"phone\" placeholder=\"+7 (___) ___-__-__\"></label><label>Комментарий<textarea name=\"comment\" placeholder=\"Производительность, сырьё, продукт и условия площадки\"></textarea></label><label class=\"consent\"><input type=\"checkbox\" required><span>Я согласен на обработку персональных данных.</span></label><button class=\"button gold full\" type=\"submit\">Получить консультацию →</button></form><div class=\"success\" id=\"success\"><span>✓</span><h3>Заявка подготовлена</h3><p>В рабочей версии данные будут переданы инженеру вместе с выбранной конфигурацией и рекламным источником.</p><a class=\"button outline\" href=\"#examples\">Вернуться к конфигурациям</a></div></div></div></section>\n  </main>\n\n  <footer class=\"footer\"><div class=\"container\"><div class=\"footer-inner\"><div><strong>ТТС Инжиниринг Казахстан</strong><br><span>Заводы и технологические линии для строительной индустрии</span></div><a href=\"ТТС_прототип_лендинга_Казахстан.html\">← Вернуться на главную</a></div><div class=\"footer-bottom\"><span>© 2026 ТТС Инжиниринг Казахстан</span><span>Каталог заводов SmartDryMix</span></div></div></footer>\n\n  <script>\n    const configField=document.getElementById('configField');\n    document.querySelectorAll('.config-request').forEach(link=>link.addEventListener('click',()=>{configField.value=link.dataset.config||'Подобрать индивидуально'}));\n    document.getElementById('zsssForm').addEventListener('submit',event=>{event.preventDefault();event.currentTarget.style.display='none';document.getElementById('success').classList.add('visible')});\n  <\/script>\n</body>\n</html>\n","ТТС_каталог_бетонных_заводов.html":"<!doctype html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <title>Бетонные заводы SmartBeton — каталог для Казахстана</title>\n  <meta name=\"description\" content=\"Бетонные заводы SmartBeton для товарного бетона, ЖБИ и дорожного строительства. Четыре готовые конфигурации, собственная АСУ SmartMix и полный цикл от проекта до запуска.\">\n  <style>\n    :root{--g950:#102f25;--g900:#173e30;--g800:#245744;--g700:#36755b;--cream:#f3eddf;--cream2:#faf7ef;--paper:  43px;border-top:1px solid var(--line)}.asu-list li:last-child{border-bottom:1px solid var(--line)}.asu-list li:before{position:absolute;left:0;top:21px;content:\"✓\";color:var(--g700);font-weight:700}.asu-list strong{display:block;margin-bottom:5px;color:var(--g950)}.asu-list span{color:var(--muted);font-size:14px}.comparison{overflow-x:auto}.comparison table{width:100%;min-width:810px;border-collapse:collapse;background:var(--paper);border:1px solid var(--line)}.comparison th,.comparison td{padding:19px 20px;text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}.comparison th{color:#fff;background:var(--g800);font-size:12px;letter-spacing:.06em;text-transform:uppercase}.comparison td:first-child{color:var(--g950);font-weight:700}.comparison td{color:var(--muted);font-size:13px}.comparison-note{margin-top:18px;color:var(--muted);font-size:12px}.contact{padding:105px 0;color:#fff;background:var(--g800)}.contact-grid{display:grid;grid-template-columns:1fr .9fr;gap:80px;align-items:center}.contact h2{color:#fff}.contact-copy>p:not(.eyebrow){color:rgba(255,255,255,.72);font-size:18px}.contact-details{margin-top:38px;display:grid;gap:6px;color:rgba(255,255,255,.7)}.contact-details strong{color:#fff}.form-card{min-height:650px;padding:40px;color:var(--ink);background:var(--paper);box-shadow:var(--shadow)}.form-card h3{margin-bottom:8px;font:31px Georgia,serif}.form-card>form>p{color:var(--muted);font-size:13px}.form-card label{margin-top:15px;display:grid;gap:7px;font-size:12px}.form-card input,.form-card select,.form-card textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:3px;outline:none;background:#fff}.form-card textarea{min-height:78px;resize:vertical}.consent{grid-template-columns:20px 1fr!important;align-items:start}.consent input{width:18px;height:18px;margin-top:2px}.full{width:100%;margin-top:20px}.success{min-height:560px;display:none;place-items:center;align-content:center;text-align:center}.success.visible{display:grid}.success>span{width:70px;height:70px;display:grid;place-items:center;color:#fff;background:var(--g700);border-radius:50%;font-size:30px}.success h3{margin:20px 0 8px}.success p{max-width:390px;color:var(--muted)}.footer{padding:55px 0 25px;color:rgba(255,255,255,.66);background:#0c251d}.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:30px}.footer a{color:#fff;text-decoration:none;font-size:13px}.footer-bottom{margin-top:35px;padding-top:20px;display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.13);font-size:11px}\n    @media(max-width:1050px){.hero-grid,.contact-grid,.asu-grid,.mixing-grid{grid-template-columns:1fr}.config-card{grid-template-columns:1fr}.config-photo{min-height:300px;border-right:0;border-bottom:1px solid var(--line)}.cycle-grid{grid-template-columns:repeat(3,1fr)}.nav{display:none}}\n    @media(max-width:760px){.applications-grid,.config-grid{grid-template-columns:1fr}.cycle-grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.metrics div:nth-child(2){border-right:0}}\n    @media(max-width:640px){.container{width:min(100% - 30px,1240px)}.topline-inner span:last-child{display:none}.header-inner{min-height:82px}.brand-mark{width:46px;height:46px}.header .button{display:none}.hero{padding:35px 0 62px}h1{font-size:43px}h2{font-size:40px}.hero-copy>p:not(.eyebrow){font-size:17px}.hero-buttons,.hero-buttons .button{width:100%}.hero-placeholder{min-height:360px}.metrics,.feed-grid,.cycle-grid{grid-template-columns:1fr}.metrics div{border-right:0}.section{padding:76px 0}.cycle-card{min-height:230px}.contact{padding:76px 0}.contact-grid{gap:42px}.form-card{padding:28px 22px}.footer-inner,.footer-bottom{align-items:flex-start;flex-direction:column}}\n  </style>\n<style data-monochrome-theme>\n    :root{--g950:#0b0b0b;--g900:#171717;--g800:#292929;--g700:#444;--cream:#e8e8e6;--cream2:#f5f5f3;--paper:#fff;--gold:#666;--gold2:#d0d0d0;--ink:#181818;--muted:#666;--line:#cececa;--shadow:0 24px 70px rgba(0,0,0,.14)}\n    html{filter:grayscale(1)}\n  </style></head>\n<body>\n  <div class=\"topline\"><div class=\"container topline-inner\"><span>Инжиниринг для строительной индустрии Казахстана с 2006 года</span><span>Собственная АСУ SmartMix · техподдержка 24/7</span></div></div>\n  <header class=\"header\"><div class=\"container header-inner\"><a class=\"brand\" href=\"ТТС_прототип_лендинга_Казахстан.html\"><span class=\"brand-mark\">ТТС</span><span><strong>ТТС Инжиниринг</strong><small>Казахстан</small></span></a><nav class=\"nav\"><a href=\"#applications\">Применение</a><a href=\"#models\">Модели</a><a href=\"#technology\">Технология</a><a href=\"#smartmix\">АСУ SmartMix</a></nav><a class=\"button primary\" href=\"#contact\">Получить расчёт</a></div></header>\n\n  <main>\n    <div class=\"container breadcrumb\"><a href=\"ТТС_прототип_лендинга_Казахстан.html\">Главная</a> &nbsp;/&nbsp; Каталог оборудования &nbsp;/&nbsp; Бетонные заводы</div>\n\n    <section class=\"hero\"><div class=\"container hero-grid\"><div class=\"hero-copy\"><p class=\"eyebrow\">Бетонные заводы для Казахстана</p><h1>Бетонные заводы SmartBeton</h1><p>Проектируем и производим заводы под ваш продукт, площадку и логистику — полный цикл от чертежей до запуска и обучения персонала.</p><div class=\"hero-buttons\"><a class=\"button primary\" href=\"#models\">Смотреть модели →</a><a class=\"button outline\" href=\"#contact\">Обсудить проект</a></div></div><div class=\"hero-frame\"><div class=\"hero-placeholder\" aria-label=\"Место для фотографии бетонного завода SmartBeton\"></div><div class=\"hero-note\">Товарный бетон · ЖБИ · дорожное строительство</div></div></div></section>\n\n    <div class=\"container metrics\"><div><strong>50–100</strong><span>м³/ч — фактическая производительность готовых конфигураций</span></div><div><strong>3</strong><span>основных сценария: товарный бетон, ЖБИ и дороги</span></div><div><strong>1</strong><span>оператор управляет всем заводом через SmartMix</span></div><div><strong>24/7</strong><span>техническая поддержка собственной АСУ</span></div></div>\n\n    <section class=\"section\" id=\"applications\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Три направления</p><h2>Один завод — под требования вашего продукта</h2><p>SmartBeton предназначен для производства товарного бетона и широкого спектра бетонных смесей. Компоновка и состав оборудования определяются рецептурами, объёмом выпуска, логистикой сырья и ограничениями площадки.</p></div><div class=\"applications-grid\"><article class=\"application-card\"><span>01</span><h3>Товарный бетон</h3><p>Стабильный выпуск востребованных марок и прозрачный контроль каждого замеса — для самостоятельного производства и поставки бетона на объекты.</p><b>Стабильное качество в разных климатических условиях</b></article><article class=\"application-card\"><span>02</span><h3>ЖБИ</h3><p>Точное дозирование и повторяемость рецептур для производств, где однородность смеси напрямую влияет на качество готовых изделий.</p><b>Интеграция в технологию действующего цеха</b></article><article class=\"application-card\"><span>03</span><h3>Строительство дорог</h3><p>Производительные решения для крупных инфраструктурных задач с подбором схемы подачи заполнителей под темп работ и логистику площадки.</p><b>Конфигурация под масштаб проекта</b></article></div></div></section>\n\n    <section class=\"section configurations\" id=\"models\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Готовые конфигурации в наличии</p><h2>Четыре модели SmartBeton</h2><p>Производительность указана для реальной работы завода. Финальная комплектация уточняется под тип смеси, заполнители, климат, площадку и требуемую степень автоматизации.</p></div><div class=\"config-grid\">\n      <article class=\"config-card\"><div class=\"config-photo\" aria-label=\"Место для фотографии SmartBeton 60\"><b>Компактный</b><span>60</span></div><div class=\"config-body\"><h3>SmartBeton 60</h3><p>Компактный завод для старта производства товарного бетона. Подходит для площадок с ограниченным пространством и стабильно работает в различных климатических условиях.</p><div class=\"config-specs\"><div><strong>до 50 м³/ч</strong><span>фактическая производительность</span></div><div><strong>Старт</strong><span>масштаб производства</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"SmartBeton 60\">Запросить комплектацию →</a></div></article>\n      <article class=\"config-card\"><div class=\"config-photo\" aria-label=\"Место для фотографии SmartBeton 90\"><b>Средний</b><span>90</span></div><div class=\"config-body\"><h3>SmartBeton 90</h3><p>Завод средней производительности с гибкой комплектацией под тип смеси, выбранную схему подачи заполнителей и условия конкретной площадки.</p><div class=\"config-specs\"><div><strong>до 75 м³/ч</strong><span>фактическая производительность</span></div><div><strong>Гибкий</strong><span>подбор комплектации</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"SmartBeton 90\">Запросить комплектацию →</a></div></article>\n      <article class=\"config-card\"><div class=\"config-photo\" aria-label=\"Место для фотографии SmartBeton 120\"><b>Универсальный</b><span>120</span></div><div class=\"config-body\"><h3>SmartBeton 120</h3><p>Универсальный завод для товарного бетона и широкого спектра бетонных смесей — когда важны производительность, стабильность и возможность адаптации.</p><div class=\"config-specs\"><div><strong>до 90 м³/ч</strong><span>фактическая производительность</span></div><div><strong>Широкий</strong><span>спектр бетонных смесей</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"SmartBeton 120\">Запросить комплектацию →</a></div></article>\n      <article class=\"config-card\"><div class=\"config-photo\" aria-label=\"Место для фотографии SmartBeton 135\"><b>Для больших объёмов</b><span>135</span></div><div class=\"config-body\"><h3>SmartBeton 135</h3><p>Решение для крупных объёмов и масштабных задач, где требуется высокая фактическая производительность и согласованная работа всех узлов завода.</p><div class=\"config-specs\"><div><strong>до 100 м³/ч</strong><span>фактическая производительность</span></div><div><strong>Крупный</strong><span>масштаб производства</span></div></div><a class=\"button primary model-request\" href=\"#contact\" data-model=\"SmartBeton 135\">Запросить комплектацию →</a></div></article>\n    </div></div></section>\n\n    <section class=\"section mixing\" id=\"technology\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Технология производства</p><h2>Стабильный бетон начинается со смешивания и правильной подачи</h2><p>Двухвальный смеситель CO-NELE обеспечивает стабильное смешивание бетона и снижает риск неоднородности, которая может привести к дефектам конечной продукции.</p></div><div class=\"mixing-grid\"><article class=\"mixer-card\"><strong>CO-NELE</strong><h3>Двухвальный смеситель</h3><p>Интенсивное и равномерное перемешивание компонентов для повторяемого результата от замеса к замесу. Типоразмер и режим работы подбираются под рецептуру и требуемую производительность.</p></article><div class=\"feed-grid\"><article class=\"feed-card\"><span>ВАРИАНТ 01</span><h3>Ленточный конвейер</h3><p>Ускоряет подачу заполнителей и подходит для больших объектов с достаточной площадью под размещение оборудования.</p><b>Приоритет: темп и высокая загрузка</b></article><article class=\"feed-card\"><span>ВАРИАНТ 02</span><h3>Скиповой подъёмник</h3><p>Компактное решение для ограниченных площадок с удобной эксплуатацией в стеснённых условиях.</p><b>Приоритет: компактность</b></article></div></div></div></section>\n\n    <section class=\"section\" id=\"cycle\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Производство под ключ</p><h2>Полный цикл — от чертежей до запуска</h2><p>Проектируем завод как единую систему под продукт, доступную площадку и логистику заказчика, затем производим, запускаем и передаём его обученной команде.</p></div><div class=\"cycle-grid\"><article class=\"cycle-card\"><span>01</span><h3>Исходные данные</h3><p>Уточняем продукт, рецептуры, производительность, климат, логистику сырья и ограничения площадки.</p></article><article class=\"cycle-card\"><span>02</span><h3>Проект и чертежи</h3><p>Разрабатываем технологическую схему, компоновку, требования к фундаментам и инженерным подключениям.</p></article><article class=\"cycle-card\"><span>03</span><h3>Производство</h3><p>Изготавливаем и комплектуем узлы завода, смесительное оборудование и собственную систему автоматизации.</p></article><article class=\"cycle-card\"><span>04</span><h3>Монтаж и запуск</h3><p>Поставляем оборудование, выполняем шефмонтаж, пусконаладку и выводим линию на рабочий режим.</p></article><article class=\"cycle-card\"><span>05</span><h3>Обучение</h3><p>Обучаем операторов работе с оборудованием и АСУ SmartMix, обеспечиваем техническую поддержку 24/7.</p></article></div></div></section>\n\n    <section class=\"section asu\" id=\"smartmix\"><div class=\"container asu-grid\"><div class=\"asu-panel\"><p class=\"eyebrow\" style=\"color:var(--gold2)\">Собственная АСУ ТП</p><h2>SmartMix делает производство предсказуемым</h2><p>Система хранит рецептуры, контролирует точность дозирования, ведёт учёт материалов и формирует отчёты по каждому замесу.</p><div class=\"asu-metrics\"><div><strong>700+</strong><span>систем работают в России и СНГ</span></div><div><strong>100+</strong><span>функций управления в одном интерфейсе</span></div><div><strong>1</strong><span>оператор на весь бетонный завод</span></div><div><strong>24/7</strong><span>техническая поддержка разработчика</span></div></div></div><div><p class=\"eyebrow\">Контроль и прозрачность</p><h2>Каждый замес — под контролем</h2><ul class=\"asu-list\"><li><strong>Рецептуры и точность дозирования</strong><span>Хранение настроек и автоматический контроль выполнения рецептуры во время производства.</span></li><li><strong>Учёт материалов и отчёты</strong><span>Фиксация расхода компонентов и формирование отчёта по каждому произведённому замесу.</span></li><li><strong>Интеграция с 1С и ERP</strong><span>Обмен производственными данными с учётными системами предприятия.</span></li><li><strong>Защита рецептов и отчёты в Telegram</strong><span>Разграничение доступа к производственным данным и оперативное получение ключевых отчётов.</span></li><li><strong>Режим «Тренажёр»</strong><span>Обучение операторов работе с интерфейсом и производственными сценариями без риска для действующего процесса.</span></li></ul></div></div></section>\n\n    <section class=\"section\" id=\"compare\"><div class=\"container\"><div class=\"section-head\"><p class=\"eyebrow\">Сравнение линейки</p><h2>Выберите ориентир по объёму производства</h2><p>Таблица помогает определить стартовую модель. Инженер подтвердит выбор после проверки рецептур, логистики и исходных данных площадки.</p></div><div class=\"comparison\"><table><thead><tr><th>Модель</th><th>Фактическая производительность</th><th>Основной сценарий</th><th>Площадка и масштаб</th></tr></thead><tbody><tr><td>SmartBeton 60</td><td>до 50 м³/ч</td><td>Старт производства товарного бетона</td><td>Ограниченное пространство, компактная компоновка</td></tr><tr><td>SmartBeton 90</td><td>до 75 м³/ч</td><td>Средние объёмы, разные типы смесей</td><td>Гибкий подбор состава оборудования</td></tr><tr><td>SmartBeton 120</td><td>до 90 м³/ч</td><td>Товарный бетон и широкий спектр смесей</td><td>Универсальная производственная площадка</td></tr><tr><td>SmartBeton 135</td><td>до 100 м³/ч</td><td>Крупные объёмы и масштабные задачи</td><td>Высокая загрузка и развитая логистика</td></tr></tbody></table></div><p class=\"comparison-note\">Производительность зависит от состава бетона, времени цикла, схемы подачи, влажности и характеристик материалов, а также условий эксплуатации.</p></div></section>\n\n    <section class=\"contact\" id=\"contact\"><div class=\"container contact-grid\"><div class=\"contact-copy\"><p class=\"eyebrow\" style=\"color:var(--gold2)\">Обсудим проект</p><h2>Получите комплектацию SmartBeton под вашу задачу</h2><p>Инженер уточнит назначение завода, требуемую производительность, рецептуры, способ подачи заполнителей и данные площадки, затем подготовит исходную конфигурацию.</p><div class=\"contact-details\"><strong>Филиал ТТС Инжиниринг в Казахстане</strong><span>Алматы, ул. Казыбек Би, 22, офис 302</span><span>Техническая поддержка АСУ SmartMix — 24/7</span></div></div><div class=\"form-card\"><form id=\"concreteForm\"><h3>Оставьте исходные данные</h3><p>Это прототип формы. В рабочей версии заявка будет передаваться профильному инженеру.</p><label>Модель<input id=\"modelField\" name=\"model\" value=\"Подобрать индивидуально\"></label><label>Назначение завода<select name=\"application\"><option>Товарный бетон</option><option>Производство ЖБИ</option><option>Строительство дорог</option><option>Несколько направлений</option></select></label><label>Подача заполнителей<select name=\"feed\"><option>Требуется подобрать</option><option>Ленточный конвейер</option><option>Скиповой подъёмник</option></select></label><label>Ваше имя<input required name=\"name\" placeholder=\"Имя Фамилия\"></label><label>Телефон для связи<input required name=\"phone\" placeholder=\"+7 (___) ___-__-__\"></label><label>Комментарий<textarea name=\"comment\" placeholder=\"Производительность, продукт и условия площадки\"></textarea></label><label class=\"consent\"><input type=\"checkbox\" required><span>Я согласен на обработку персональных данных.</span></label><button class=\"button gold full\" type=\"submit\">Получить консультацию →</button></form><div class=\"success\" id=\"success\"><span>✓</span><h3>Заявка подготовлена</h3><p>В рабочей версии данные будут переданы инженеру вместе с выбранной моделью, назначением завода и рекламным источником.</p><a class=\"button outline\" href=\"#models\">Вернуться к моделям</a></div></div></div></section>\n  </main>\n\n  <footer class=\"footer\"><div class=\"container\"><div class=\"footer-inner\"><div><strong>ТТС Инжиниринг Казахстан</strong><br><span>Заводы и технологические линии для строительной индустрии</span></div><a href=\"ТТС_прототип_лендинга_Казахстан.html\">← Вернуться на главную</a></div><div class=\"footer-bottom\"><span>© 2026 ТТС Инжиниринг Казахстан</span><span>Каталог бетонных заводов SmartBeton</span></div></div></footer>\n\n  <script>\n    const modelField=document.getElementById('modelField');\n    document.querySelectorAll('.model-request').forEach(link=>link.addEventListener('click',()=>{modelField.value=link.dataset.model||'Подобрать индивидуально'}));\n    document.getElementById('concreteForm').addEventListener('submit',event=>{event.preventDefault();event.currentTarget.style.display='none';document.getElementById('success').classList.add('visible')});\n  <\/script>\n</body>\n</html>\n","ТТС_каталог_заводов_ВПИ.html":"<!doctype html>\n<html lang=\"ru\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  <title>Готовые линии ВПИ QUNFENG + ТТС в Казахстане</title>\n  <meta name=\"description\" content=\"Готовые линии вибропрессования QUNFENG + ТТС: БСУ SmartBeton, вибропресс, камеры набора прочности, пресс-формы, паллетирование, автоматизация и запуск.\">\n  <style>\n    :root{--black:#090909;--black2:#151515;--dark:#242424;--paper:#fff;--soft:#f1f1ef;--soft2:#e4e4e1;--ink:#171717;--muted:#656565;--line:#cdcdca;--accent:#4b4b4b;--shadow:0 24px 70px rgba(0,0,0,.14)}\n    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:#f7f7f5;font:16px/1.55 Arial,Helvetica,sans-serif}a{color:inherit}button,input,textarea{font:inherit}h1,h2,h3,h4,p{margin-top:0}h1,h2{font-family:Georgia,\"Times New Roman\",serif;font-weigh
